        "title": "Book Introduction",
        "html": "<h1>Artificial Intelligence, Machine Learning and Big Data Analytics</h1><p><strong>First Year · Book 10</strong></p><h3>FIRST YEAR BOOK 10 • AI AND BIG DATA</h3>\n<h3>2</h3>\n<h3>Introduction</h3>\n<p>Artificial intelligence, machine learning, databases, and big data analytics are connected fields used in modern digital services. This book introduces their basic ideas and real-world applications in simple language. It also explains why accuracy, privacy, and human oversight matter.</p>\n<h3>Learning Objectives</h3>\n<p>• Define AI and explain common applications. • Describe how ML models are trained and evaluated. • Compare supervised, unsupervised, semi-supervised, and reinforcement learning. • Explain deep learning and neural networks. • Discuss AI applications in business, healthcare, education, and other industries. • Identify responsible AI practices. • Explain databases, DBMS, and big data analytics.</p><figure><img src=\"assets/firstyear10-figure-01.png\" alt=\"Relationship between AI, machine learning and deep learning\"><figcaption>Original AI, ML and deep learning relationship diagram, PDF page 1.</figcaption></figure>"

      {
        "title": "Chapter 1: Introduction to Artificial Intelligence",
        "html": "<h1>Chapter 1: Introduction to Artificial Intelligence</h1><p><em>Chapter 1 learning goal: Understand and apply the key ideas of introduction to artificial intelligence.</em></p>\n<h3>What AI Means</h3>\n<p>Artificial intelligence is the field of creating computer systems that perform tasks associated with human intelligence, such as recognizing patterns, understanding language, making predictions, and supporting decisions. AI does not necessarily think or feel like a person.</p>\n<h3>AI in Everyday Life</h3>\n<p>Spell-checking, predictive typing, recommendation systems, navigation suggestions, and customer-service chatbots are familiar examples. Some tools use simple rules, while others use machine learning; not every automated feature is AI.</p>\n<h3>How an AI System Works</h3>\n<p>An AI application receives data, processes it using a model or rules, and produces a result. For example, a shopping service may analyze past purchases and suggest products, but its suggestions can be incorrect.</p>\n<h3>Benefits and Limitations</h3>\n<p>AI can process large datasets quickly, assist with repetitive tasks, and identify patterns. However, poor data, biased examples, privacy problems, and overconfidence can lead to unreliable outputs.</p>\n<h3>Worked Example / Real-Life Scenario</h3>\n<p>A music app recommends songs after analyzing listening history. The suggestion may help discovery, but a user can still reject it. Chapter Summary Remember: what ai means; ai in everyday life; how an ai system works.</p>"

      {
        "title": "Chapter 2: Machine Learning Fundamentals",
        "html": "<h1>Chapter 2: Machine Learning Fundamentals</h1><figure><img src=\"assets/firstyear10-figure-02.png\" alt=\"Original learning diagram for Chapter 2\" loading=\"lazy\"><figcaption>Original diagram from PDF page 5.</figcaption></figure><p><em>Chapter 2 learning goal: Understand and apply the key ideas of machine learning fundamentals.</em></p>\n<h3>Collect data Train model Test model Predict</h3>\n<h3>What Machine Learning Is</h3>\n<p>Machine learning (ML) is a branch of AI in which a model learns patterns from examples instead of relying only on manually written instructions.</p>\n<h3>Training and Testing</h3>\n<p>A training dataset helps a model learn. A separate test dataset checks how well it performs on unseen examples. Mixing training and test examples can make performance look better than it really is.</p>\n<h3>Example: Cat Recognition</h3>\n<p>Images labeled cat or not cat can be used to train an image classifier. The model learns useful visual patterns; it does not memorize the meaning of a cat as a human does.</p>\n<h3>Important Terms</h3>\n<p>Features are information used to make predictions; labels are target answers in supervised learning. Accuracy is one evaluation measure, but precision and recall may matter more in some tasks.</p>\n<h3>Worked Example / Real-Life Scenario</h3>\n<p>A model trains on 800 labeled photos and is evaluated on 200 different photos. Testing on unseen photos helps estimate real performance. Chapter Summary Remember: what machine learning is; training and testing; example: cat recognition.</p>"

        "title": "Chapter 3: Four Machine Learning Methods",
        "html": "<h1>Chapter 3: Four Machine Learning Methods</h1><figure><img src=\"assets/firstyear10-figure-03.png\" alt=\"Original learning diagram for Chapter 3\" loading=\"lazy\"><figcaption>Original diagram from PDF page 7.</figcaption></figure><p><em>Chapter 3 learning goal: Understand and apply the key ideas of four machine learning methods.</em></p>\n<h3>Supervised Unsupervised Semi-supervised Reinforcement</h3>\n<h3>Supervised Learning</h3>\n<p>Supervised learning uses labeled examples. A model might learn from transactions marked fraudulent or legitimate, then estimate the risk of new transactions.</p>\n<h3>Unsupervised Learning</h3>\n<p>Unsupervised learning looks for structure in data without target labels. A store might group customers with similar shopping habits, but those groups still need human interpretation.</p>\n<h3>Semi-supervised Learning</h3>\n<p>Semi-supervised learning combines a smaller amount of labeled data with a larger amount of unlabeled data. This can help when expert labeling is expensive.</p>\n<h3>Reinforcement Learning</h3>\n<p>In reinforcement learning, an agent chooses actions in an environment and receives rewards or penalties. It learns a policy that aims to increase long-term reward, as in some games and robotic control tasks.</p>\n<h3>Choosing a Method</h3>\n<p>Use supervised learning when known answers are available; unsupervised learning for discovering groups; semi-supervised learning when labels are limited; reinforcement learning for sequential decisions with feedback.</p>\n<h3>Worked Example / Real-Life Scenario</h3>\n<p>A teacher labels essays as on-topic or off-topic (supervised); a shop groups customers without labels (unsupervised). Chapter Summary Remember: supervised learning; unsupervised learning; semi-supervised learning.</p>"

        "title": "Chapter 4: Deep Learning and Neural Networks",
        "html": "<h1>Chapter 4: Deep Learning and Neural Networks</h1><figure><img src=\"assets/firstyear10-figure-04.png\" alt=\"Original learning diagram for Chapter 4\" loading=\"lazy\"><figcaption>Original diagram from PDF page 9.</figcaption></figure><p><em>Chapter 4 learning goal: Understand and apply the key ideas of deep learning and neural networks.</em></p>\n<h3>Input layer Hidden layers Output layer</h3>\n<h3>Deep Learning</h3>\n<p>Deep learning is a branch of machine learning that uses neural networks with multiple layers to learn complex patterns from data.</p>\n<h3>Neural Network Structure</h3>\n<p>An artificial neural network contains connected processing units, usually arranged into input, hidden, and output layers. Connections have adjustable weights that training changes.</p>\n<h3>How Learning Happens</h3>\n<p>During training, a network compares predictions with expected answers, measures an error, and adjusts weights. This process is repeated over many examples.</p>\n<h3>Applications</h3>\n<p>Deep learning is useful for image recognition, speech processing, text analysis, and other pattern-rich tasks. It can require substantial computing power and data.</p>\n<h3>Common Misconception</h3>\n<p>Neural networks are inspired loosely by biological neurons, but they are not copies of the human brain. Not all neural networks are deep, and not all machine learning uses neural networks.</p>\n<h3>Worked Example / Real-Life Scenario</h3>\n<p>A network takes pixel values as input, transforms them through hidden layers, and outputs the estimated class of an image. Chapter Summary Remember: deep learning; neural network structure; how learning happens.</p>"

        "title": "Chapter 5: AI Technology Landscape",
        "html": "<h1>Chapter 5: AI Technology Landscape</h1><p><em>Chapter 5 learning goal: Understand and apply the key ideas of ai technology landscape.</em></p>\n<h3>Robotics</h3>\n<p>Robots are physical machines that can sense, act, and sometimes use AI for perception or decision-making. Industrial robots may also perform fixed programmed tasks without AI.</p>\n<h3>Language Translation and Assistants</h3>\n<p>Machine translation converts content between languages. Digital assistants may use speech recognition and language understanding to respond to spoken or typed requests.</p>\n<h3>Autonomous Systems</h3>\n<p>An autonomous system can perform some tasks with limited human input. Examples include warehouse robots and some vehicle functions. The degree of autonomy varies, and safety supervision may be required.</p>\n<h3>Gaming, AR, and VR</h3>\n<p>AI can guide non-player characters and adaptive gameplay. Augmented reality adds digital content to a real view, while virtual reality creates an immersive simulated environment; neither technology automatically requires AI.</p>\n<h3>Computer Vision</h3>\n<p>Computer vision helps software interpret visual information such as images and video. Applications include identifying objects, checking product defects, and supporting medical image review.</p>\n<h3>Worked Example / Real-Life Scenario</h3>\n<p>A warehouse robot reads sensors, identifies obstacles, chooses a safe route, and moves while monitoring its surroundings. Chapter Summary Remember: robotics; language translation and assistants; autonomous systems.</p>"

        "title": "Chapter 6: AI in Business and Industry",
        "html": "<h1>Chapter 6: AI in Business and Industry</h1><p><em>Chapter 6 learning goal: Understand and apply the key ideas of ai in business and industry.</em></p>\n<h3>AI for Business Decisions</h3>\n<p>Organizations may use AI to identify trends, predict demand, support scheduling, and prioritize customer inquiries. Managers should check results against business goals and evidence.</p>\n<h3>Financial Services</h3>\n<p>ML can help detect unusual transactions, estimate risk, and assist analysts. High-impact financial decisions require controls, review, and appropriate regulation.</p>\n<h3>Retail and Marketing</h3>\n<p>Retailers can analyze purchase histories to recommend products and forecast inventory needs. Responsible systems limit data collection and explain relevant privacy choices.</p>\n<h3>Government and Utilities</h3>\n<p>Public services may use data models to detect equipment failures or allocate resources. Fairness, accountability, and security are especially important when public services are affected.</p>\n<h3>Oil, Gas, and Manufacturing</h3>\n<p>Predictive maintenance can identify patterns in equipment sensor data that suggest possible failure. Engineers still need to validate alerts and plan repairs.</p>\n<h3>Tourism and Travel</h3>\n<p>Forecasting models can estimate travel demand or possible price changes. Predictions are uncertain and should not be treated as guaranteed prices.</p>\n<h3>Worked Example / Real-Life Scenario</h3>\n<p>A retailer forecasts next month’s demand using historical sales, then a manager checks holiday effects before ordering stock. Chapter Summary Remember: ai for business decisions; financial services; retail and marketing.</p>"

        "title": "Chapter 7: AI in Healthcare and Education",
        "html": "<h1>Chapter 7: AI in Healthcare and Education</h1><p><em>Chapter 7 learning goal: Understand and apply the key ideas of ai in healthcare and education.</em></p>\n<h3>Healthcare Applications</h3>\n<p>AI can support image analysis, monitoring, clinical documentation, and research. These systems assist qualified professionals rather than replace medical judgment.</p>\n<h3>Wearable Devices</h3>\n<p>Wearable sensors can record measurements such as heart rate and activity. Algorithms may flag unusual patterns, but alerts are not a diagnosis.</p>\n<h3>Medical Imaging and Genomics</h3>\n<p>Computer vision can highlight patterns in scans. AI may help researchers study genetic data and explore personalized treatment options; evidence and clinical validation remain essential.</p>\n<h3>Robots, Telemedicine, and 3D Printing</h3>\n<p>Robots can help with transport, rehabilitation, or surgical assistance. Telemedicine connects patients and clinicians remotely. 3D printing can produce models, tools, and some medical devices; these are related technologies, not automatically AI.</p>\n<h3>AI in Education</h3>\n<p>AI can help with practice questions, feedback, accessibility, and administrative tasks. Teachers should check automated grading and protect student information.</p>\n<h3>Safety and Ethics</h3>\n<p>Health and education systems need privacy protections, human oversight, careful testing, and clear communication of limitations.</p>\n<h3>Worked Example / Real-Life Scenario</h3>\n<p>A wearable flags an unusual reading. A healthcare professional evaluates the information and decides whether further tests are needed. Chapter Summary Remember: healthcare applications; wearable devices; medical imaging and genomics.</p>"

        "title": "Chapter 8: Responsible AI and Data Ethics",
        "html": "<h1>Chapter 8: Responsible AI and Data Ethics</h1><p><em>Chapter 8 learning goal: Understand and apply the key ideas of responsible ai and data ethics.</em></p>\n<h3>Privacy</h3>\n<p>AI systems often depend on data. Collect only what is needed, secure sensitive information, and respect permissions and applicable rules.</p>\n<h3>Bias and Fairness</h3>\n<p>Training data may underrepresent some groups or contain historical unfairness. Testing across relevant populations can reveal performance differences.</p>\n<h3>Accuracy and Transparency</h3>\n<p>AI predictions may sound confident while being incorrect. Explain what a system can and cannot do and verify important outputs.</p>\n<h3>Human Oversight</h3>\n<p>People should remain responsible for important decisions in areas such as education, healthcare, employment, and finance.</p>\n<h3>Responsible Use by Students</h3>\n<p>Check AI-generated information, cite sources where required, avoid uploading confidential data, and follow academic integrity policies.</p>\n<h3>Worked Example / Real-Life Scenario</h3>\n<p>A student checks an AI-generated explanation against the textbook and does not upload classmates’ private records. Chapter Summary Remember: privacy; bias and fairness; accuracy and transparency.</p>"

        "title": "Chapter 9: Databases and Database Management Systems",
        "html": "<h1>Chapter 9: Databases and Database Management Systems</h1><figure><img src=\"assets/firstyear10-figure-05.png\" alt=\"Original learning diagram for Chapter 9\" loading=\"lazy\"><figcaption>Original diagram from PDF page 19.</figcaption></figure><h3>CHAPTER 9: DATABASES AND DATABASE MANAGEMENT</h3>\n<h3>SYSTEMS</h3>\n<p><em>Chapter 9 learning goal: Understand and apply the key ideas of databases and database management systems.</em></p>\n<h3>Collect records Store in DBMS Query data Use insights</h3>\n<h3>What Is Data?</h3>\n<p>Data consists of recorded facts, measurements, observations, or categories. Information results when data is organized and interpreted for a purpose.</p>\n<h3>What Is a Database?</h3>\n<p>A database is an organized collection of data. For example, a school database may store student records, subjects, and enrollment details.</p>\n<h3>Database Management System</h3>\n<p>A DBMS is software that helps create, store, update, retrieve, and protect data. Examples of database operations include inserting records, searching, editing, and controlling access.</p>\n<h3>Why Databases Matter</h3>\n<p>Databases can improve organization, reduce unnecessary duplication, support data integrity, and make retrieval easier. Proper backups and access controls are still necessary.</p>\n<h3>Tables and Records</h3>\n<p>A relational database often stores data in tables. Rows represent records and columns represent attributes, such as student ID, name, and course.</p>\n<h3>Relationship to AI</h3>\n<p>Well-managed databases can supply useful training and analysis data, but data quality and permission to use it remain important.</p>\n<h3>Worked Example / Real-Life Scenario</h3>\n<p>A student database stores ID, name, and course in columns. Each student has a separate row, and permissions limit who can edit records. Chapter Summary Remember: what is data?; what is a database?; database management system.</p>"

        "title": "Chapter 10: Big Data Analytics and the Future",
        "html": "<h1>Chapter 10: Big Data Analytics and the Future</h1><figure><img src=\"assets/firstyear10-figure-06.png\" alt=\"Original learning diagram for Chapter 10\" loading=\"lazy\"><figcaption>Original diagram from PDF page 21.</figcaption></figure><p><em>Chapter 10 learning goal: Understand and apply the key ideas of big data analytics and the future.</em></p>\n<h3>Ask question Prepare data Analyze Explain findings</h3>\n<h3>What Is Big Data?</h3>\n<p>Big data refers to datasets that can be difficult to handle with traditional approaches because of their size, speed, variety, or other characteristics. A large dataset alone does not automatically produce useful insights.</p>\n<h3>The Three Vs</h3>\n<p>Volume describes how much data exists; velocity describes how quickly it arrives; variety describes different forms, such as text, images, and sensor measurements. Other useful concerns include veracity and value.</p>\n<h3>Analytics Process</h3>\n<p>An analyst defines a question, collects relevant data, cleans errors, explores patterns, builds or applies methods, and communicates findings.</p>\n<h3>Examples</h3>\n<p>Healthcare organizations may study patient trends; factories can analyze sensor readings; retailers can forecast demand; and researchers can examine environmental data.</p>\n<h3>AI and Big Data</h3>\n<p>Big data can provide material for machine learning, while AI can help analyze complex patterns. However, data quality, privacy, computing costs, and interpretation remain major challenges.</p>\n<h3>Future Directions</h3>\n<p>Cloud platforms, connected sensors, edge computing, and new AI methods may expand data use. Responsible design and critical thinking will remain important.</p>\n<h3>Worked Example / Real-Life Scenario</h3>\n<p>A school studies anonymized attendance trends, checks missing values, and presents findings without exposing individual students. Chapter Summary Remember: what is big data?; the three vs; analytics process.</p>"

(function () {
    const toggle = document.getElementById("themeToggle");
    const reader = document.querySelector(".reader");

    if (!toggle || !reader) return;

    const key = "bytebloom-reader-theme";

    function setTheme(mode) {
        const dark = mode === "dark";

        reader.classList.toggle("dark-mode", dark);

        toggle.textContent = dark
            ? "☀️ Light Mode"
            : "🌙 Dark Mode";

        toggle.setAttribute("aria-pressed", String(dark));
    }

    let saved = "light";

    try {
        saved = localStorage.getItem(key) || "light";
    } catch (_) {}

    setTheme(saved);

    toggle.addEventListener("click", function () {
        const mode = reader.classList.contains("dark-mode")
            ? "light"
            : "dark";

        setTheme(mode);

        try {
            localStorage.setItem(key, mode);
        } catch (_) {}
    });
})();
