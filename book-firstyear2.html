    <script>
const LESSON_PAGES = [
  {
    "title": "UNIT 7: EVOLUTION OF COMPUTERS",
    "html": "<h1>UNIT 7: EVOLUTION OF COMPUTERS</h1>\n<p><strong>A Complete Learning Guide to Computer Generations, Components, and Technological Development</strong></p>\n<p>Subject: Introduction to Computing<br />\nYear Level: First Year College<br />\nPrepared by: [Insert Group Members]</p>\n<hr />\n<h1>BOOK INTRODUCTION</h1>\n<p>Computers have changed greatly over the years. Early electronic computers were very large, expensive, and required a lot of electricity. Modern computers are smaller, faster, more reliable, and easier to use.</p>\n<p>These changes became possible because of important developments in electronic components, memory devices, programming languages, and computer processing technology.</p>\n<p>The evolution of computers is commonly divided into five generations. Each generation represents an important development in computer technology.</p>\n<p>This E-Book discusses the basic components that helped computers develop and explains the characteristics of each computer generation.</p>\n<p>It also introduces important concepts such as vacuum tubes, transistors, integrated circuits, microprocessors, memory, programming languages, and artificial intelligence.</p>\n<p>By studying these topics, students will understand how computers developed from large electronic machines into the powerful devices used today.</p>\n<h1>GENERAL LEARNING OBJECTIVES</h1>\n<p>After completing this unit, students should be able to:</p>\n<ol>\n<li>Explain the meaning of computer evolution.</li>\n<li>Identify the five generations of computers.</li>\n<li>Describe the technologies used in each generation.</li>\n<li>Define important computer components.</li>\n<li>Explain the differences between machine language and assembly language.</li>\n<li>Identify the memory technologies used by different generations.</li>\n<li>Compare the characteristics of the five computer generations.</li>\n<li>Explain the importance of artificial intelligence in modern computing.</li>\n<li>Identify examples of computers from different generations.</li>\n<li>Appreciate how computer technology has improved over time.</li>\n</ol>\n<hr />\n<h1>TABLE OF CONTENTS</h1>\n<p><strong>Chapter 1:</strong> Introduction to the Evolution of Computers</p>\n<p><strong>Chapter 2:</strong> Important Computer Components and Technologies</p>\n<p><strong>Chapter 3:</strong> Computer Memory and Programming Languages</p>\n<p><strong>Chapter 4:</strong> First Generation of Computers</p>\n<p><strong>Chapter 5:</strong> Second Generation of Computers</p>\n<p><strong>Chapter 6:</strong> Third Generation of Computers</p>\n<p><strong>Chapter 7:</strong> Fourth Generation of Computers</p>\n<p><strong>Chapter 8:</strong> Fifth Generation of Computers</p>\n<p><strong>Chapter 9:</strong> Comparison of the Five Generations</p>\n<p><strong>Chapter 10:</strong> The Importance of Computer Evolution</p>\n<p><strong>Additional Sections</strong></p>\n<ul>\n<li>Practical Learning Activities</li>\n<li>Chapter Quizzes</li>\n<li>Final Assessment</li>\n<li>Answer Key and Explanations</li>\n<li>Glossary of Terms</li>\n<li>Learning Resources</li>\n<li>References</li>\n<li>Conclusion</li>\n</ul>\n<hr />\n"
  },
  {
    "title": "CHAPTER 1: INTRODUCTION TO THE EVOLUTION OF COMPUTERS",
    "html": "<h1>CHAPTER 1: INTRODUCTION TO THE EVOLUTION OF COMPUTERS</h1>\n<h2>Learning Objectives</h2>\n<p>After completing this chapter, students should be able to explain computer evolution, describe why computers have changed, and identify the five computer generations.</p>\n<h2>1.1 What Is Computer Evolution?</h2>\n<p>Computer evolution refers to the continuous development and improvement of computer technology over time.</p>\n<p>Computers have changed in terms of size, speed, processing power, memory, reliability, and energy consumption.</p>\n<p>Early electronic computers were large and required entire rooms for installation.</p>\n<p>Today, computers can be found in homes, schools, offices, and even in people's pockets.</p>\n<p>These improvements became possible because scientists and engineers developed new electronic components and better ways of processing information.</p>\n<h2>1.2 Why Do Computers Evolve?</h2>\n<p>Computer technology continues to improve because people need machines that can perform tasks more efficiently.</p>\n<p>Some important reasons for computer development include:</p>\n<p><strong>Faster Processing</strong></p>\n<p>Computers need to perform calculations and process information quickly.</p>\n<p><strong>Smaller Size</strong></p>\n<p>Developers create smaller electronic components so computers can become more portable.</p>\n<p><strong>Lower Power Consumption</strong></p>\n<p>Modern components are designed to use electricity more efficiently.</p>\n<p><strong>Greater Storage Capacity</strong></p>\n<p>Computers need enough memory and storage to handle programs and information.</p>\n<p><strong>Better Reliability</strong></p>\n<p>Computer systems must operate accurately and consistently.</p>\n<p><strong>Improved User Experience</strong></p>\n<p>Modern computers provide easier ways for people to interact with technology.</p>\n<h2>1.3 The Five Generations of Computers</h2>\n<p>Computer evolution is commonly divided into five generations.</p>\n<table>\n<thead>\n<tr>\n  <th>Generation</th>\n  <th>Timeline Used in This Unit</th>\n  <th>Main Technology</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>First Generation</td>\n  <td>1940s–1950s</td>\n  <td>Vacuum tubes</td>\n</tr>\n<tr>\n  <td>Second Generation</td>\n  <td>1950s–1960s</td>\n  <td>Transistors</td>\n</tr>\n<tr>\n  <td>Third Generation</td>\n  <td>1960s–1970s</td>\n  <td>Integrated circuits</td>\n</tr>\n<tr>\n  <td>Fourth Generation</td>\n  <td>1970s–present</td>\n  <td>Microprocessors</td>\n</tr>\n<tr>\n  <td>Fifth Generation</td>\n  <td>Present and future</td>\n  <td>Artificial intelligence</td>\n</tr>\n</tbody>\n</table>\n<p>These periods are approximate. The generations describe major technological developments rather than completely separate periods.</p>\n<h2>1.4 How Computer Generations Are Classified</h2>\n<p>Each generation is identified by important improvements in technology.</p>\n<p>These improvements include:</p>\n<ul>\n<li>Electronic components</li>\n<li>Memory technology</li>\n<li>Programming languages</li>\n<li>Computer size</li>\n<li>Processing speed</li>\n<li>Power consumption</li>\n<li>Input and output devices</li>\n<li>Reliability and efficiency</li>\n</ul>\n<p>For example, first-generation computers used vacuum tubes, while second-generation computers used transistors.</p>\n<p>This replacement made computers smaller and more efficient.</p>\n<h2>1.5 Computer Evolution in Everyday Life</h2>\n<p>The development of computers has changed how people study, work, and communicate.</p>\n<p>Computers are now used for:</p>\n<ul>\n<li>Online learning</li>\n<li>Research</li>\n<li>Communication</li>\n<li>Business operations</li>\n<li>Entertainment</li>\n<li>Programming</li>\n<li>Data processing</li>\n<li>Scientific calculations</li>\n</ul>\n<p>Computer evolution continues as new technologies are developed.</p>\n"
  },
  {
    "title": "CHAPTER 2: IMPORTANT COMPUTER COMPONENTS AND TECHNOLOGIES",
    "html": "<h1>CHAPTER 2: IMPORTANT COMPUTER COMPONENTS AND TECHNOLOGIES</h1>\n<h2>Learning Objectives</h2>\n<p>After completing this chapter, students should be able to define vacuum tubes, transistors, integrated circuits, microprocessors, and CPUs.</p>\n<h2>2.1 Vacuum Tube</h2>\n<figure><img src=\"assets/firstyear2-figure-01.png\" alt=\"Vacuum tube\" loading=\"lazy\"><figcaption>Vacuum tube — original illustration from the supplied PDF</figcaption></figure>\n<p>A vacuum tube is an electronic device that controls the movement of electrons inside a vacuum.</p>\n<p>Vacuum tubes can work as electronic switches or amplifiers.</p>\n<p>They were used in older electronic equipment such as radios, televisions, and early computers.</p>\n<h3>Characteristics</h3>\n<ul>\n<li>Used in first-generation computers</li>\n<li>Relatively large</li>\n<li>Required considerable electricity</li>\n<li>Produced a lot of heat</li>\n<li>Needed frequent maintenance</li>\n</ul>\n<h3>Importance</h3>\n<p>Vacuum tubes made early electronic computing possible.</p>\n<p>However, their size and power requirements limited the efficiency of early computers.</p>\n<h2>2.2 Transistor</h2>\n<figure><img src=\"assets/firstyear2-figure-02.png\" alt=\"Transistor\" loading=\"lazy\"><figcaption>Transistor — original illustration from the supplied PDF</figcaption></figure>\n<p>A transistor is an electronic component that can act as a switch or amplifier.</p>\n<p>It controls the flow of electrical signals in electronic circuits.</p>\n<p>Transistors replaced vacuum tubes in second-generation computers.</p>\n<h3>Characteristics</h3>\n<ul>\n<li>Smaller than vacuum tubes</li>\n<li>More energy-efficient</li>\n<li>More reliable</li>\n<li>Produced less heat</li>\n<li>Supported faster computer operation</li>\n</ul>\n<h3>Importance</h3>\n<p>The invention and adoption of transistors made computers smaller, faster, and more practical.</p>\n<h2>2.3 Integrated Circuit (IC)</h2>\n<figure><img src=\"assets/firstyear2-figure-03.png\" alt=\"Integrated circuit\" loading=\"lazy\"><figcaption>Integrated circuit — original illustration from the supplied PDF</figcaption></figure>\n<p>An integrated circuit is a small electronic circuit containing several connected components on a chip, usually made of silicon.</p>\n<p>These components may include transistors, diodes, and resistors.</p>\n<p>Integrated circuits became the main technology of third-generation computers.</p>\n<h3>Characteristics</h3>\n<ul>\n<li>Contains multiple electronic components</li>\n<li>Occupies less space than separate components</li>\n<li>Supports faster processing</li>\n<li>Improves reliability</li>\n<li>Reduces manufacturing complexity for many electronic systems</li>\n</ul>\n<h3>Importance</h3>\n<p>Integrated circuits allowed computers to become smaller, cheaper, and more efficient.</p>\n<h2>2.4 Microprocessor</h2>\n<figure><img src=\"assets/firstyear2-figure-04.png\" alt=\"Microprocessor\" loading=\"lazy\"><figcaption>Microprocessor — original illustration from the supplied PDF</figcaption></figure>\n<p>A microprocessor is an electronic component that contains a computer's central processing unit on an integrated circuit.</p>\n<p>It performs instructions and controls many computer operations.</p>\n<p>Microprocessors became the main technology associated with fourth-generation computers.</p>\n<h3>Characteristics</h3>\n<ul>\n<li>Contains processing circuitry on a chip</li>\n<li>Performs calculations</li>\n<li>Executes program instructions</li>\n<li>Supports compact computer designs</li>\n<li>Can process information quickly</li>\n</ul>\n<h3>Importance</h3>\n<p>Microprocessors helped make personal computers possible.</p>\n<p>They also supported the development of many portable electronic devices.</p>\n<h2>2.5 Central Processing Unit (CPU)</h2>\n<figure><img src=\"assets/firstyear2-figure-05.png\" alt=\"Central processing unit\" loading=\"lazy\"><figcaption>Central processing unit — original illustration from the supplied PDF</figcaption></figure>\n<p>The Central Processing Unit, commonly called the CPU, is responsible for executing instructions and processing data.</p>\n<p>It is often described as the brain of the computer.</p>\n<h3>Main Functions</h3>\n<p><strong>Processing Instructions</strong></p>\n<p>The CPU executes instructions from computer programs.</p>\n<p><strong>Performing Calculations</strong></p>\n<p>The CPU carries out arithmetic operations.</p>\n<p><strong>Making Logical Decisions</strong></p>\n<p>The CPU performs comparisons and logical operations.</p>\n<p><strong>Controlling Operations</strong></p>\n<p>The CPU coordinates many activities within the computer system.</p>\n<h3>Example</h3>\n<p>When a student opens a computer application, the CPU processes the instructions needed to run that application.</p>\n<h2>2.6 Comparison of Computer Components</h2>\n<table>\n<thead>\n<tr>\n  <th>Component</th>\n  <th>Main Function</th>\n  <th>Associated Generation</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Vacuum tube</td>\n  <td>Electronic switching and amplification</td>\n  <td>First</td>\n</tr>\n<tr>\n  <td>Transistor</td>\n  <td>Controls electrical signals</td>\n  <td>Second</td>\n</tr>\n<tr>\n  <td>Integrated circuit</td>\n  <td>Combines electronic components on a chip</td>\n  <td>Third</td>\n</tr>\n<tr>\n  <td>Microprocessor</td>\n  <td>Executes processing instructions</td>\n  <td>Fourth</td>\n</tr>\n<tr>\n  <td>CPU</td>\n  <td>Performs computer processing</td>\n  <td>Used across generations</td>\n</tr>\n</tbody>\n</table>\n"
  },

    "title": "CHAPTER 3: COMPUTER MEMORY AND PROGRAMMING LANGUAGES",
    "html": "<h1>CHAPTER 3: COMPUTER MEMORY AND PROGRAMMING LANGUAGES</h1>\n<h2>Learning Objectives</h2>\n<p>Students should be able to define computer memory, identify early memory technologies, and distinguish between machine language and assembly language.</p>\n<h2>3.1 What Is Computer Memory?</h2>\n<p>Computer memory refers to components used to store data and instructions.</p>\n<p>Memory is important because computers need information while performing operations.</p>\n<p>Different generations used different memory technologies.</p>\n<h2>3.2 Magnetic Drum</h2>\n<figure><img src=\"assets/firstyear2-figure-06.png\" alt=\"Magnetic drum\" loading=\"lazy\"><figcaption>Magnetic drum — original illustration from the supplied PDF</figcaption></figure>\n<p>A magnetic drum is a rotating cylinder coated with magnetic material.</p>\n<p>It was used to store data and programs in early computers.</p>\n<h3>Characteristics</h3>\n<ul>\n<li>Uses magnetic material</li>\n<li>Stores information on a rotating cylinder</li>\n<li>Used in early computing systems</li>\n</ul>\n<h3>Importance</h3>\n<p>Magnetic drums were important early memory devices before newer memory technologies became common.</p>\n<h2>3.3 Magnetic Core Memory</h2>\n<figure><img src=\"assets/firstyear2-figure-07.png\" alt=\"Magnetic core memory\" loading=\"lazy\"><figcaption>Magnetic core memory — original illustration from the supplied PDF</figcaption></figure>\n<p>Magnetic core memory uses small rings made of magnetic material to store information.</p>\n<p>Each ring represents information through its magnetic state.</p>\n<h3>Characteristics</h3>\n<ul>\n<li>Uses magnetic cores</li>\n<li>Stores information magnetically</li>\n<li>Was used in early computer systems</li>\n<li>Became an important memory technology in the second and third generations</li>\n</ul>\n<h2>3.4 Machine Language</h2>\n<p>Machine language is a low-level programming language made of binary instructions.</p>\n<p>Binary uses two digits:</p>\n<ul>\n<li>0</li>\n<li>1</li>\n</ul>\n<p>Computers can directly execute machine instructions supported by their processors.</p>\n<h3>Example</h3>\n<p>A simplified binary sequence may look like:</p>\n<p><code>10110010</code></p>\n<p>The meaning of a machine instruction depends on the computer's processor architecture.</p>\n<h3>Characteristics</h3>\n<ul>\n<li>Uses binary instructions</li>\n<li>Closely connected to computer hardware</li>\n<li>Difficult for people to read</li>\n<li>Used in first-generation computing</li>\n</ul>\n<h2>3.5 Assembly Language</h2>\n<p>Assembly language is a low-level programming language that uses symbolic instructions instead of writing every instruction as binary digits.</p>\n<p>Examples of instruction names include:</p>\n<ul>\n<li>ADD</li>\n<li>SUB</li>\n<li>DIV</li>\n</ul>\n<h3>Example</h3>\n<p><code>ADD A, B</code></p>\n<p>This is a simplified illustration of an addition instruction. Actual assembly syntax depends on the processor.</p>\n<h3>Importance</h3>\n<p>Assembly language makes low-level programming easier to read than machine language.</p>\n<p>An assembler converts assembly instructions into machine code.</p>\n<h2>3.6 Machine Language vs. Assembly Language</h2>\n<table>\n<thead>\n<tr>\n  <th>Machine Language</th>\n  <th>Assembly Language</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Uses binary instructions</td>\n  <td>Uses symbolic instructions</td>\n</tr>\n<tr>\n  <td>Directly executed by the processor</td>\n  <td>Requires assembly into machine code</td>\n</tr>\n<tr>\n  <td>Difficult for people to read</td>\n  <td>Easier to read than binary</td>\n</tr>\n<tr>\n  <td>Associated with early computing</td>\n  <td>Commonly associated with second-generation computers</td>\n</tr>\n</tbody>\n</table>\n<h2>3.7 Random-Access Memory (RAM)</h2>\n<figure><img src=\"assets/firstyear2-figure-08.png\" alt=\"Computer memory\" loading=\"lazy\"><figcaption>Computer memory — original illustration from the supplied PDF</figcaption></figure>\n<p>RAM is a type of computer memory used to temporarily store data and instructions.</p>\n<p>RAM is commonly volatile, meaning its contents are lost when power is removed.</p>\n<h3>Example</h3>\n<p>When a user opens an application, information needed by the running application may be stored in RAM.</p>\n<h2>3.8 Read-Only Memory (ROM)</h2>\n<p>ROM is a type of non-volatile memory.</p>\n<p>It retains stored information even when power is removed.</p>\n<p>ROM is commonly associated with firmware and information needed for device operation.</p>\n<h2>3.9 RAM vs. ROM</h2>\n<table>\n<thead>\n<tr>\n  <th>RAM</th>\n  <th>ROM</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Usually volatile</td>\n  <td>Non-volatile</td>\n</tr>\n<tr>\n  <td>Used for temporary working information</td>\n  <td>Used for information intended to persist</td>\n</tr>\n<tr>\n  <td>Supports running programs</td>\n  <td>Often stores firmware</td>\n</tr>\n<tr>\n  <td>Contents are normally lost when power is removed</td>\n  <td>Contents remain without power</td>\n</tr>\n</tbody>\n</table>\n"
  },

    "title": "CHAPTER 4: FIRST GENERATION OF COMPUTERS",
    "html": "<h1>CHAPTER 4: FIRST GENERATION OF COMPUTERS</h1>\n<h2>Learning Objectives</h2>\n<p>Students should identify the characteristics, technologies, and examples of first-generation computers.</p>\n<h2>4.1 Introduction</h2>\n<figure><img src=\"assets/firstyear2-figure-09.png\" alt=\"Vacuum tube\" loading=\"lazy\"><figcaption>Vacuum tube — original illustration from the supplied PDF</figcaption></figure>\n<figure><img src=\"assets/firstyear2-figure-10.png\" alt=\"First-generation computer\" loading=\"lazy\"><figcaption>First-generation computer — original illustration from the supplied PDF</figcaption></figure>\n<p>The first generation of electronic computers developed during the 1940s and 1950s.</p>\n<p>These computers used vacuum tubes as their main electronic components.</p>\n<p>They were large machines that required significant electricity and produced considerable heat.</p>\n<h2>4.2 Main Electronic Component</h2>\n<p>The main electronic component was the vacuum tube.</p>\n<p>Vacuum tubes performed electronic switching functions needed for computer operations.</p>\n<p>However, they generated heat and required considerable space.</p>\n<h2>4.3 Memory Technology</h2>\n<p>First-generation computers used technologies such as:</p>\n<ul>\n<li>Magnetic drums</li>\n<li>Magnetic tapes</li>\n</ul>\n<p>These devices stored data and instructions.</p>\n<h2>4.4 Programming Language</h2>\n<p>Machine language was used to program first-generation computers.</p>\n<p>Machine language consists of binary instructions.</p>\n<p>Programming these computers was difficult because instructions were closely connected to the hardware.</p>\n<h2>4.5 Power Consumption</h2>\n<p>First-generation computers consumed a large amount of electricity.</p>\n<p>They also generated significant heat.</p>\n<p>This created challenges involving cooling, maintenance, and reliability.</p>\n<h2>4.6 Speed and Size</h2>\n<p>First-generation computers were very large compared with modern computers.</p>\n<p>Some occupied entire rooms.</p>\n<p>Although they were important technological achievements, their performance was limited compared with later generations.</p>\n<h2>4.7 Input and Output Devices</h2>\n<p>Common input and output technologies included:</p>\n<ul>\n<li>Punched cards</li>\n<li>Paper tape</li>\n<li>Printed output</li>\n</ul>\n<h2>4.8 Examples</h2>\n<p><strong>ENIAC</strong></p>\n<p>Electronic Numerical Integrator and Computer.</p>\n<p>An important early electronic general-purpose computer.</p>\n<p><strong>UNIVAC I</strong></p>\n<p>Universal Automatic Computer I.</p>\n<p>An early commercial computer used for data processing.</p>\n<p><strong>IBM 650</strong></p>\n<p>An early IBM computer associated with magnetic drum storage.</p>\n<p><strong>IBM 701</strong></p>\n<p>An early IBM electronic computer designed for scientific computing.</p>\n<h2>4.9 Advantages</h2>\n<ul>\n<li>Made electronic computing possible</li>\n<li>Performed calculations automatically</li>\n<li>Supported scientific and business computing</li>\n</ul>\n<h2>4.10 Limitations</h2>\n<ul>\n<li>Very large</li>\n<li>Expensive</li>\n<li>High electricity consumption</li>\n<li>Generated substantial heat</li>\n<li>Difficult to maintain</li>\n<li>Required specialized programming knowledge</li>\n</ul>\n"
  },

    "title": "CHAPTER 5: SECOND GENERATION OF COMPUTERS",
    "html": "<h1>CHAPTER 5: SECOND GENERATION OF COMPUTERS</h1>\n<h2>Learning Objectives</h2>\n<p>Students should explain how transistors improved computers and identify the characteristics of second-generation systems.</p>\n<h2>5.1 Introduction</h2>\n<p>Second-generation computers developed during the 1950s and 1960s.</p>\n<p>The major technological improvement was the replacement of vacuum tubes with transistors.</p>\n<p>Transistors allowed computers to become smaller, faster, and more reliable.</p>\n<h2>5.2 Main Electronic Component</h2>\n<p>The main component was the transistor.</p>\n<p>Compared with vacuum tubes, transistors generally:</p>\n<ul>\n<li>Required less electricity</li>\n<li>Produced less heat</li>\n<li>Occupied less space</li>\n<li>Improved reliability</li>\n</ul>\n<h2>5.3 Memory Technology</h2>\n<p>Second-generation computers used:</p>\n<ul>\n<li>Magnetic core memory</li>\n<li>Magnetic tape</li>\n<li>Magnetic disks</li>\n</ul>\n<p>These technologies improved information storage and processing.</p>\n<h2>5.4 Programming Languages</h2>\n<p>Assembly language became important during this generation.</p>\n<p>Assembly language used symbolic instructions instead of requiring programmers to write every instruction directly in binary.</p>\n<p>This made programming more understandable.</p>\n<h2>5.5 Power and Size</h2>\n<p>Second-generation computers consumed less electricity and produced less heat than first-generation computers.</p>\n<p>They were also smaller and easier to maintain.</p>\n<h2>5.6 Speed and Reliability</h2>\n<p>Transistors improved processing speed and reliability.</p>\n<p>Computers could perform tasks more efficiently.</p>\n<h2>5.7 Input and Output Devices</h2>\n<p>Input and output technologies included:</p>\n<ul>\n<li>Punched cards</li>\n<li>Magnetic tape</li>\n<li>Printed output</li>\n</ul>\n<h2>5.8 Examples</h2>\n<p><strong>IBM 1401</strong></p>\n<p>A computer used for business data processing.</p>\n<p><strong>IBM 7090</strong></p>\n<p>A transistor-based computer used for scientific and technical applications.</p>\n<p><strong>IBM 7094</strong></p>\n<p>An improved computer in the IBM 7090 series.</p>\n<p><strong>UNIVAC 1107</strong></p>\n<p>A transistor-based computer used for large-scale processing.</p>\n<h2>5.9 Advantages</h2>\n<ul>\n<li>Smaller than first-generation computers</li>\n<li>Faster processing</li>\n<li>Lower electricity consumption</li>\n<li>Improved reliability</li>\n<li>Less heat production</li>\n</ul>\n<h2>5.10 Limitations</h2>\n<ul>\n<li>Still relatively expensive</li>\n<li>Required specialized operation</li>\n<li>Limited compared with modern computers</li>\n<li>Often relied on batch processing and older input methods</li>\n</ul>\n"
  },
  {
    "title": "CHAPTER 6: THIRD GENERATION OF COMPUTERS",
    "html": "<h1>CHAPTER 6: THIRD GENERATION OF COMPUTERS</h1>\n<h2>Learning Objectives</h2>\n<p>Students should identify the importance of integrated circuits and explain the improvements introduced during the third generation.</p>\n<h2>6.1 Introduction</h2>\n<figure><img src=\"assets/firstyear2-figure-11.png\" alt=\"Third-generation computer illustration\" loading=\"lazy\"><figcaption>Third-generation computer illustration — original illustration from the supplied PDF</figcaption></figure>\n<figure><img src=\"assets/firstyear2-figure-12.png\" alt=\"Third-generation computer illustration\" loading=\"lazy\"><figcaption>Third-generation computer illustration — original illustration from the supplied PDF</figcaption></figure>\n<p>Third-generation computers developed during the 1960s and 1970s.</p>\n<p>The main technology was the integrated circuit.</p>\n<p>Integrated circuits combined several electronic components on a single chip.</p>\n<p>This helped improve computer speed, size, and efficiency.</p>\n<h2>6.2 Main Electronic Component</h2>\n<p>The main electronic component was the integrated circuit.</p>\n<p>Integrated circuits reduced the need to connect large numbers of separate components.</p>\n<h2>6.3 Memory Technology</h2>\n<p>Third-generation computers used:</p>\n<ul>\n<li>Larger magnetic core memory</li>\n<li>Magnetic tapes</li>\n<li>Magnetic disks</li>\n</ul>\n<p>These technologies supported more demanding applications.</p>\n<h2>6.4 Programming Languages</h2>\n<p>High-level programming languages became increasingly important.</p>\n<p>Examples discussed in the original lesson include:</p>\n<ul>\n<li>FORTRAN</li>\n<li>BASIC</li>\n<li>Pascal</li>\n<li>COBOL</li>\n<li>C</li>\n</ul>\n<p>These languages are associated with the broader period of high-level language development; they were not all introduced at the beginning of the third generation.</p>\n<h2>6.5 Computer Size</h2>\n<p>Third-generation computers became smaller and more efficient.</p>\n<p>Minicomputers also became important during this period.</p>\n<p>Minicomputers provided computing capabilities in systems smaller than traditional large computers.</p>\n<h2>6.6 Speed and Reliability</h2>\n<p>Integrated circuits improved:</p>\n<ul>\n<li>Processing speed</li>\n<li>Reliability</li>\n<li>Efficiency</li>\n<li>Computer performance</li>\n</ul>\n<h2>6.7 Input and Output Devices</h2>\n<p>Common devices included:</p>\n<ul>\n<li>Keyboard</li>\n<li>Monitor</li>\n<li>Printer</li>\n<li>Magnetic tape</li>\n</ul>\n<p>These devices made computers easier to operate.</p>\n<h2>6.8 Examples</h2>\n<p><strong>IBM System/360</strong></p>\n<p>An important family of computers used for business and scientific applications.</p>\n<p><strong>IBM System/370</strong></p>\n<p>A later IBM computer family.</p>\n<p><strong>PDP-11</strong></p>\n<p>A minicomputer family used in education, research, and industry.</p>\n<p><strong>UNIVAC 1108</strong></p>\n<p>A computer used for scientific and large-scale processing.</p>\n<h2>6.9 Advantages</h2>\n<ul>\n<li>Smaller size</li>\n<li>Faster processing</li>\n<li>Improved reliability</li>\n<li>Better user interaction</li>\n<li>Support for high-level programming</li>\n</ul>\n<h2>6.10 Limitations</h2>\n<ul>\n<li>Still required specialized maintenance</li>\n<li>Could be expensive</li>\n<li>Less portable than modern computers</li>\n</ul>\n"
  },

    "title": "CHAPTER 7: FOURTH GENERATION OF COMPUTERS",
    "html": "<h1>CHAPTER 7: FOURTH GENERATION OF COMPUTERS</h1>\n<h2>Learning Objectives</h2>\n<p>Students should explain microprocessor technology, VLSI, semiconductor memory, and the development of personal computers.</p>\n<h2>7.1 Introduction</h2>\n<figure><img src=\"assets/firstyear2-figure-13.png\" alt=\"Microprocessor and computer technology\" loading=\"lazy\"><figcaption>Microprocessor and computer technology — original illustration from the supplied PDF</figcaption></figure>\n<figure><img src=\"assets/firstyear2-figure-14.png\" alt=\"Personal computer\" loading=\"lazy\"><figcaption>Personal computer — original illustration from the supplied PDF</figcaption></figure>\n<figure><img src=\"assets/firstyear2-figure-15.png\" alt=\"Early computer equipment\" loading=\"lazy\"><figcaption>Early computer equipment — original illustration from the supplied PDF</figcaption></figure>\n<p>Fourth-generation computers began developing during the 1970s.</p>\n<p>Their main technological development was the microprocessor.</p>\n<p>Microprocessors made it possible to place important processing components on small chips.</p>\n<p>This helped computers become smaller, faster, cheaper, and more accessible.</p>\n<h2>7.2 Very Large-Scale Integration (VLSI)</h2>\n<p>VLSI stands for Very Large-Scale Integration.</p>\n<p>It refers to the integration of very large numbers of transistors into a single chip.</p>\n<p>The original lesson describes VLSI as placing thousands of transistors on a microchip.</p>\n<p>This technology supports the development of complex electronic circuits.</p>\n<h2>7.3 Microprocessors</h2>\n<p>A microprocessor contains CPU processing circuitry on a chip.</p>\n<p>It executes program instructions and supports computer operations.</p>\n<p>Microprocessors helped make personal computers practical.</p>\n<h2>7.4 Semiconductor Memory</h2>\n<p>Fourth-generation computers use semiconductor memory technologies.</p>\n<p>Examples include:</p>\n<p><strong>RAM — Random-Access Memory</strong></p>\n<p>RAM temporarily stores information used by running programs.</p>\n<p><strong>ROM — Read-Only Memory</strong></p>\n<p>ROM is non-volatile memory used for information that needs to remain stored without power.</p>\n<h2>7.5 Programming Languages</h2>\n<p>The original lesson includes several high-level programming languages associated with the wider fourth-generation era and modern computing.</p>\n<p>Examples include:</p>\n<ul>\n<li>Python</li>\n<li>C#</li>\n<li>Java</li>\n<li>JavaScript</li>\n<li>Rust</li>\n<li>Kotlin</li>\n</ul>\n<p>These languages were developed at different times, but all are examples of languages used in modern computing.</p>\n<h2>7.6 Computer Size</h2>\n<p>Fourth-generation computers became smaller and more affordable.</p>\n<p>Personal computers became available to more users.</p>\n<h2>7.7 Speed and Reliability</h2>\n<p>Microprocessors and improved electronic circuits supported:</p>\n<ul>\n<li>Faster processing</li>\n<li>Greater accuracy</li>\n<li>Better reliability</li>\n<li>Improved energy efficiency</li>\n</ul>\n<h2>7.8 Input and Output Devices</h2>\n<p>Common devices included:</p>\n<ul>\n<li>Keyboard</li>\n<li>Mouse and other pointing devices</li>\n<li>Monitor</li>\n<li>Printer</li>\n<li>Optical scanners</li>\n</ul>\n<h2>7.9 Computer Networks</h2>\n<p>A computer network is a group of two or more computer systems connected to exchange information and resources.</p>\n<p>Networks allow computers to communicate and share information.</p>\n<h2>7.10 Examples</h2>\n<p><strong>IBM PC</strong></p>\n<p>A personal computer introduced by IBM.</p>\n<p><strong>Apple II</strong></p>\n<p>An early personal computer that helped popularize home computing.</p>\n<p><strong>Apple Macintosh</strong></p>\n<p>A personal computer family known for its graphical user interface.</p>\n<p><strong>STAR 1000</strong></p>\n<p>Listed as an example in the original lesson.</p>\n<h2>7.11 Advantages</h2>\n<ul>\n<li>Smaller computers</li>\n<li>Lower costs</li>\n<li>Faster processing</li>\n<li>Better storage technology</li>\n<li>More accessible personal computing</li>\n<li>Improved networking capabilities</li>\n</ul>\n"
  },

    "title": "CHAPTER 8: FIFTH GENERATION OF COMPUTERS",
    "html": "<h1>CHAPTER 8: FIFTH GENERATION OF COMPUTERS</h1>\n<h2>Learning Objectives</h2>\n<p>Students should understand artificial intelligence, ULSI, parallel processing, and natural language interaction.</p>\n<h2>8.1 Introduction</h2>\n<p>The fifth generation is commonly described as the present and future of computing.</p>\n<p>The original lesson associates this generation with artificial intelligence, ultra large-scale integration, and parallel processing.</p>\n<p>Unlike the earlier generations, fifth-generation computing is often described as a continuing goal rather than a single hardware replacement.</p>\n<h2>8.2 Artificial Intelligence (AI)</h2>\n<p>Artificial intelligence is an area of computer science focused on developing systems that perform tasks associated with human intelligence.</p>\n<p>Examples include:</p>\n<ul>\n<li>Speech recognition</li>\n<li>Language processing</li>\n<li>Pattern recognition</li>\n<li>Learning from data</li>\n<li>Automated decision support</li>\n</ul>\n<h2>8.3 Ultra Large-Scale Integration (ULSI)</h2>\n<p>ULSI stands for Ultra Large-Scale Integration.</p>\n<p>The original lesson describes ULSI as integrating millions of transistors into a single microchip.</p>\n<p>This supports increasingly complex electronic systems.</p>\n<h2>8.4 Parallel Processing</h2>\n<p>Parallel processing means using multiple processing units or resources to perform tasks simultaneously.</p>\n<p>This can help computers handle complex operations more efficiently.</p>\n<h3>Example</h3>\n<p>A computer system may divide a large calculation into smaller parts that can be processed at the same time.</p>\n<h2>8.5 Natural Language Processing</h2>\n<p>Natural language processing allows computers to work with human language.</p>\n<p>Examples include:</p>\n<ul>\n<li>Voice assistants</li>\n<li>Speech-to-text applications</li>\n<li>Language translation</li>\n<li>Chat-based AI systems</li>\n</ul>\n<h2>8.6 Power and Efficiency</h2>\n<p>The original lesson describes fifth-generation systems as using less power and producing less heat.</p>\n<p>In practice, energy use depends on the type of device and workload. Large AI systems can require substantial electricity, even as individual components become more efficient.</p>\n<h2>8.7 Speed and Reliability</h2>\n<p>Modern computing technologies support improvements in:</p>\n<ul>\n<li>Processing speed</li>\n<li>Accuracy</li>\n<li>Reliability</li>\n<li>Storage capacity</li>\n<li>Advanced data analysis</li>\n</ul>\n<h2>8.8 Input and Output Devices</h2>\n<p>Modern computing systems may use:</p>\n<ul>\n<li>Keyboard</li>\n<li>Monitor</li>\n<li>Mouse</li>\n<li>Touchpad</li>\n<li>Touchscreen</li>\n<li>Digital pen</li>\n<li>Speech input</li>\n<li>Scanner</li>\n<li>Printer</li>\n</ul>\n<h2>8.9 Examples</h2>\n<p>The original lesson lists modern devices such as:</p>\n<ul>\n<li>Desktop computers</li>\n<li>Laptops</li>\n<li>Tablets</li>\n<li>Smartphones</li>\n</ul>\n<p>These are modern computing devices that may support AI applications. The devices themselves are not necessarily classified as fifth-generation computers solely because of their form factor.</p>\n<h2>8.10 Importance of Fifth-Generation Computing</h2>\n<p>Fifth-generation concepts are important because they support the development of more intelligent and capable computer systems.</p>\n<p>They also help researchers explore new approaches to solving complex problems.</p>\n"
  },
  {
    "title": "CHAPTER 9: COMPARISON OF THE FIVE GENERATIONS",
    "html": "<h1>CHAPTER 9: COMPARISON OF THE FIVE GENERATIONS</h1>\n<h2>Learning Objectives</h2>\n<p>Students should compare the five generations and identify important technological improvements.</p>\n<h2>9.1 Overview</h2>\n<p>The development of computers can be understood by comparing their electronic components, memory technologies, programming languages, and performance.</p>\n<p>Each generation introduced improvements that influenced later technologies.</p>\n<h2>9.2 Comparison Table</h2>\n<table>\n<thead>\n<tr>\n  <th>Generation</th>\n  <th>Main Technology</th>\n  <th>Memory</th>\n  <th>Programming</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>First</td>\n  <td>Vacuum tubes</td>\n  <td>Magnetic drums and tapes</td>\n  <td>Machine language</td>\n</tr>\n<tr>\n  <td>Second</td>\n  <td>Transistors</td>\n  <td>Magnetic core and magnetic storage</td>\n  <td>Assembly language</td>\n</tr>\n<tr>\n  <td>Third</td>\n  <td>Integrated circuits</td>\n  <td>Magnetic core and magnetic storage</td>\n  <td>High-level languages</td>\n</tr>\n<tr>\n  <td>Fourth</td>\n  <td>Microprocessors and VLSI</td>\n  <td>Semiconductor memory</td>\n  <td>Modern high-level languages</td>\n</tr>\n<tr>\n  <td>Fifth</td>\n  <td>AI-oriented systems and advanced integration</td>\n  <td>Advanced memory and storage</td>\n  <td>AI and natural language technologies</td>\n</tr>\n</tbody>\n</table>\n<h2>9.3 Changes in Computer Size</h2>\n<p>First-generation computers were often extremely large.</p>\n<p>Later generations became smaller as electronic components improved.</p>\n<p>Microprocessors made compact personal computers possible.</p>\n<p>Modern devices can be small enough to carry in a pocket.</p>\n<h2>9.4 Changes in Processing Speed</h2>\n<p>Computer speed improved as components became more advanced.</p>\n<p>Vacuum tubes were replaced by transistors.</p>\n<p>Transistors were combined into integrated circuits.</p>\n<p>Microprocessors placed complex processing capabilities on chips.</p>\n<p>Modern systems use advanced processors and parallel processing.</p>\n<h2>9.5 Changes in Programming</h2>\n<p>Programming also became more accessible.</p>\n<p><strong>First Generation:</strong> Machine language</p>\n<p><strong>Second Generation:</strong> Assembly language</p>\n<p><strong>Third Generation:</strong> Greater use of high-level languages</p>\n<p><strong>Fourth Generation:</strong> Broad use of modern programming languages</p>\n<p><strong>Fifth Generation:</strong> Increasing use of AI systems and natural language interaction</p>\n<p>These developments overlap, and earlier programming languages are still used in some systems.</p>\n<h2>9.6 Changes in User Interaction</h2>\n<p>Early computers used punched cards and paper tape.</p>\n<p>Later computers supported keyboards, monitors, and printers.</p>\n<p>Modern computers use graphical interfaces, touchscreens, speech recognition, and other interaction methods.</p>\n<h2>9.7 Why These Changes Matter</h2>\n<p>Computer development has improved access to information and computing services.</p>\n<p>Computers have become important tools in education, business, communication, and scientific research.</p>\n"

m computing</li>\n<li>Advanced processors</li>\n<li>Energy-efficient computing</li>\n<li>Robotics</li>\n<li>New memory technologies</li>\n</ul>\n<p>These technologies may influence future generations of computer systems.</p>\n<h2>10.8 The Importance of Understanding Computer History</h2>\n<p>Learning about computer evolution helps students understand how modern technology developed.</p>\n<p>It also explains why new computer systems are faster, smaller, and more powerful than older systems.</p>\n<p>For Information Technology students, this knowledge provides a foundation for studying hardware, software, programming, networking, and modern computing systems.</p>\n"

language.</p>\n<p><strong>Parallel Processing:</strong> The simultaneous execution of tasks using multiple processing resources.</p>\n<p><strong>RAM:</strong> Random-Access Memory, commonly used for temporary working information.</p>\n<p><strong>ROM:</strong> Read-Only Memory, a type of non-volatile memory.</p>\n<p><strong>Second Generation:</strong> Computers mainly associated with transistor technology.</p>\n<p><strong>Semiconductor Memory:</strong> Electronic memory made using semiconductor technology.</p>\n<p><strong>Third Generation:</strong> Computers mainly associated with integrated circuits.</p>\n<p><strong>Transistor:</strong> An electronic component used as a switch or amplifier.</p>\n<p><strong>ULSI:</strong> Ultra Large-Scale Integration.</p>\n<p><strong>Vacuum Tube:</strong> An electronic device that controls electron flow in a vacuum.</p>\n<p><strong>VLSI:</strong> Very Large-Scale Integration.</p>\n<hr />\n"

const toc = document.getElementById('toc');
const content = document.getElementById('content');
const prev = document.getElementById('prev') || document.getElementById('previous');
const next = document.getElementById('next');
const status = document.getElementById('status');
const heading = document.getElementById('heading');
let current = 0;
function render() {
  const page = LESSON_PAGES[current];
  content.innerHTML = page.html;
  if (heading) heading.textContent = page.title;
  toc.replaceChildren();
  LESSON_PAGES.forEach((item, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = item.title;
    if (i === current) b.classList.add('active');
    b.addEventListener('click', () => go(i));
    toc.appendChild(b);
  });
  prev.disabled = current === 0;
  next.disabled = current === LESSON_PAGES.length - 1;
  if (status) status.textContent = `Section ${current + 1} of ${LESSON_PAGES.length}`;
}
function go(i) {
  if (i < 0 || i >= LESSON_PAGES.length) return;
  current = i;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
prev.addEventListener('click', () => go(current-1));
next.addEventListener('click', () => go(current+1));
render();


/* BYTEBLOOM - LIGHT AND DARK MODE */

(function () {
    const toggle = document.getElementById("themeToggle");
    const reader = document.querySelector(".reader");

    if (!toggle || !reader) return;

    const key = "bytebloom-reader-theme";

    function setTheme(mode) {
        const dark = mode === "dark";

        reader.classList.toggle("dark-mode", dark);

        toggle.textContent = dark
            ? "☀️ Light Mode"
            : "🌙 Dark Mode";

        toggle.setAttribute("aria-pressed", String(dark));
    }

    let saved = "light";

    try {
        saved = localStorage.getItem(key) || "light";
    } catch (_) {}

    setTheme(saved);

    toggle.addEventListener("click", function () {
        const mode = reader.classList.contains("dark-mode")
            ? "light"
            : "dark";

        setTheme(mode);

        try {
            localStorage.setItem(key, mode);
        } catch (_) {}
    });
})();

</script>
