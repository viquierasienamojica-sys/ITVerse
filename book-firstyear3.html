  <script>
const LESSON_PAGES = [
  {
    "title": "Book Introduction",
    "html": "<h1>COMPUTER HARDWARE AND SOFTWARE</h1><p>A Complete Beginner’s Guide to Computer Components, Devices, and Software Systems</p><p>Computers help people study, communicate, work, and manage information. A computer system depends on hardware, the physical components, and software, the programs and instructions. This book explains their functions and relationships using simple examples and original illustrations from the supplied source.</p>\n<h3>General Learning Objectives</h3>\n<p>By the end of the book, students should be able to define hardware and software, identify input and output devices, describe internal components, distinguish application and system software, explain operating systems and drivers, and recognize basic maintenance practices.</p>"
  },
  {
    "title": "Chapter 1: Introduction To Computer Hardware And Software",
    "html": "<h1>CHAPTER 1: INTRODUCTION TO COMPUTER HARDWARE AND SOFTWARE</h1>\n<h3>INTRODUCTION TO COMPUTER HARDWARE</h3>\n<p><strong>Learning objective: Understand and explain the main concepts and examples presented in this chapter.</strong></p>\n<h3>Computer system</h3>\n<p>A computer system combines physical hardware and software instructions to receive input, process information, store data, and produce output.</p>\n<h3>Computer hardware</h3>\n<p>Hardware is the physical equipment that can be seen and touched: keyboards, monitors, printers, memory modules, processors, and storage devices.</p>\n<h3>Computer software</h3>\n<p>Software is a collection of programs and instructions that makes hardware perform useful tasks. Examples include operating systems, web browsers, and word processors.</p>\n<h3>Working together</h3>\n<p>When printing a document, the word processor prepares the content, the operating system and driver handle the request, and the printer produces the paper output.</p>"
  },
  {
    "title": "Chapter 2: Computer Hardware Basics",
    "html": "<h1>CHAPTER 2: COMPUTER HARDWARE BASICS</h1>\n<h3>COMPUTER HARDWARE BASICS</h3>\n<p><strong>Learning objective: Understand and explain the main concepts and examples presented in this chapter.</strong></p>\n<h3>External hardware</h3>\n<p>External devices, often called peripherals, are connected to or used outside the main computer unit. Examples include keyboards, mice, displays, microphones, and projectors.</p>\n<h3>Internal hardware</h3>\n<p>Internal components reside inside the computer case and support processing, memory, and storage. Examples include the CPU, RAM, ROM, and hard disk drive.</p>\n<h3>Why hardware matters</h3>\n<p>Physical components provide the actual electronic equipment on which software runs and through which users interact with a computer.</p>"
  },
  {
    "title": "Chapter 3: Input Devices",
    "html": "<h1>CHAPTER 3: INPUT DEVICES</h1>\n<h3>INPUT DEVICES</h3>\n<p><strong>Learning objective: Understand and explain the main concepts and examples presented in this chapter.</strong></p>\n<h3>Definition</h3>\n<p>An input device sends information or commands to a computer. Input may consist of text, sound, images, gestures, or movement.</p>\n<h3>Keyboard and mouse</h3>\n<p>A keyboard enters text and commands. A mouse moves the pointer and allows selection, clicking, and dragging.</p>\n<h3>Trackpad and touchscreen</h3>\n<p>A trackpad senses finger movement to control a pointer. A touchscreen accepts touch and also displays visual output.</p>\n<h3>Joystick, microphone, and webcam</h3>\n<p>A joystick controls movement, especially in games. A microphone captures audio, while a webcam captures images and video.</p>\n<h3>Light pen and speech input</h3>\n<p>A light pen is a historical pointing device used with compatible displays. Speech input uses a microphone and recognition software to interpret spoken commands.</p>\n<figure><img src=\"assets/firstyear3-figure-01.png\" alt=\"Original illustration for chapter 3\" loading=\"lazy\"><figcaption>Original illustration from the supplied learning material</figcaption></figure>\n<figure><img src=\"assets/firstyear3-figure-02.png\" alt=\"Original illustration for chapter 3\" loading=\"lazy\"><figcaption>Original illustration from the supplied learning material</figcaption></figure>"
  },
  {
    "title": "Chapter 4: Output Devices",
    "html": "<h1>CHAPTER 4: OUTPUT DEVICES</h1>\n<h3>OUTPUT DEVICES</h3>\n<p><strong>Learning objective: Understand and explain the main concepts and examples presented in this chapter.</strong></p>\n<h3>Definition</h3>\n<p>An output device presents processed information as visual, printed, or audio output.</p>\n<h3>Monitor and printer</h3>\n<p>A monitor displays text, images, and video. A printer produces physical copies, sometimes called hard copies.</p>\n<h3>Speakers and headphones</h3>\n<p>Speakers deliver audio to a room; headphones deliver sound directly to the listener.</p>\n<h3>Projector and display screens</h3>\n<p>A projector enlarges visual information on a surface. Tablet and smartphone screens display information and may also accept touch input.</p>\n<h3>Scanner clarification</h3>\n<p>The original lesson mentions scanners with output devices; technically, a scanner is an input device because it captures a physical document and sends its image to a computer.</p>\n<figure><img src=\"assets/firstyear3-figure-03.png\" alt=\"Original illustration for chapter 4\" loading=\"lazy\"><figcaption>Original illustration from the supplied learning material</figcaption></figure>\n<figure><img src=\"assets/firstyear3-figure-04.png\" alt=\"Original illustration for chapter 4\" loading=\"lazy\"><figcaption>Original illustration from the supplied learning material</figcaption></figure>\n<figure><img src=\"assets/firstyear3-figure-05.png\" alt=\"Original illustration for chapter 4\" loading=\"lazy\"><figcaption>Original illustration from the supplied learning material</figcaption></figure>"
  },
  {
    "title": "Chapter 5: Internal Computer Hardware",
    "html": "<h1>CHAPTER 5: INTERNAL COMPUTER HARDWARE</h1>\n<h3>INTERNAL COMPUTER HARDWARE</h3>\n<p><strong>Learning objective: Understand and explain the main concepts and examples presented in this chapter.</strong></p>\n<h3>CPU</h3>\n<p>The Central Processing Unit executes instructions, performs calculations, and coordinates computer operations.</p>\n<h3>RAM</h3>\n<p>Random-Access Memory holds working information for running programs. It is typically volatile and loses its contents without power.</p>\n<h3>ROM</h3>\n<p>Read-Only Memory is non-volatile memory often associated with firmware and startup-related information.</p>\n<h3>Hard disk drive</h3>\n<p>An HDD provides long-term storage for files, applications, and operating system data. Its contents normally remain after power is removed.</p>\n<h3>Comparison</h3>\n<p>CPU: processing. RAM: temporary working memory. ROM: persistent firmware-related information. HDD: long-term storage.</p>\n<figure><img src=\"assets/firstyear3-figure-06.png\" alt=\"Original illustration for chapter 5\" loading=\"lazy\"><figcaption>Original illustration from the supplied learning material</figcaption></figure>"
  },
  {
    "title": "Chapter 6: Computer Software Basics",
    "html": "<h1>CHAPTER 6: COMPUTER SOFTWARE BASICS</h1>\n<h3>COMPUTER SOFTWARE BASICS</h3>\n<p><strong>Learning objective: Understand and explain the main concepts and examples presented in this chapter.</strong></p>\n<h3>Definition</h3>\n<p>Computer software consists of instructions and programs that enable computer hardware to perform useful work.</p>\n<h3>Two main categories</h3>\n<p>System software manages hardware and supports applications. Application software helps users accomplish specific tasks.</p>\n<h3>Examples</h3>\n<p>Windows and device drivers are system software. Word processors, web browsers, and media players are application software.</p>\n<h3>Why software matters</h3>\n<p>Without appropriate software, users cannot easily perform tasks such as writing documents, opening websites, or organizing records.</p>"
  },
  {
    "title": "Chapter 7: Application Software",
    "html": "<h1>CHAPTER 7: APPLICATION SOFTWARE</h1>\n<h3>APPLICATION SOFTWARE</h3>\n<p><strong>Learning objective: Understand and explain the main concepts and examples presented in this chapter.</strong></p>\n<h3>Word processing and spreadsheets</h3>\n<p>Word processors create and format text documents. Spreadsheets arrange data in rows and columns and perform calculations.</p>\n<h3>Presentations and databases</h3>\n<p>Presentation programs create slides. Database management programs organize and retrieve structured information.</p>\n<h3>Browsers, email, and media players</h3>\n<p>Browsers display websites. Email programs handle electronic messages. Media players play audio and video.</p>\n<h3>Specialized applications</h3>\n<p>Accounting software manages financial information; translation and pronunciation tools assist language learning; desktop publishing software creates page layouts; enterprise software supports organizational processes.</p>"
  },

    "title": "Chapter 8: System Software",
    "html": "<h1>CHAPTER 8: SYSTEM SOFTWARE</h1>\n<h3>SYSTEM SOFTWARE</h3>\n<p><strong>Learning objective: Understand and explain the main concepts and examples presented in this chapter.</strong></p>\n<h3>Definition</h3>\n<p>System software controls computer operations, manages resources, and supports applications.</p>\n<h3>Resource and file management</h3>\n<p>It allocates processing and memory resources, helps manage storage space, and supports creating and retrieving files.</p>\n<h3>Security and device support</h3>\n<p>System software provides access controls and supports communication with hardware.</p>\n<h3>Main categories</h3>\n<p>The source lesson identifies operating systems, device drivers, utility software, and programming software as major categories.</p>\n<h3>How the parts connect</h3>\n<p>A simplified relationship is: User → Application → Operating System → Hardware.</p>\n<figure><img src=\"assets/firstyear3-figure-07.png\" alt=\"Original illustration for chapter 8\" loading=\"lazy\"><figcaption>Original illustration from the supplied learning material</figcaption></figure>"
  },
  {
    "title": "Chapter 9: Operating Systems And Device Drivers",
    "html": "<h1>CHAPTER 9: OPERATING SYSTEMS AND DEVICE DRIVERS</h1>\n<h3>OPERATING SYSTEMS AND DEVICE</h3>\n<p><strong>Learning objective: Understand and explain the main concepts and examples presented in this chapter.</strong></p>\n<h3>Operating system</h3>\n<p>An operating system manages computer resources and provides services needed by programs. Examples include Windows, macOS, Linux, Android, and iOS.</p>\n<h3>Operating system functions</h3>\n<p>It starts during booting, manages memory and processing, organizes files, handles input and output, and supports application execution.</p>\n<h3>Device drivers</h3>\n<p>A device driver helps an operating system communicate with particular hardware, such as a printer, display adapter, USB device, or audio device.</p>\n<h3>Printing example</h3>\n<p>An application requests printing; the operating system passes the job through the printer driver; the printer produces the output.</p>"
  },

    "html": "<h1>CHAPTER 10: UTILITY SOFTWARE AND MAINTENANCE</h1>\n<h3>UTILITY SOFTWARE AND MAINTENANCE</h3>\n<p><strong>Learning objective: Understand and explain the main concepts and examples presented in this chapter.</strong></p>\n<h3>Utility software</h3>\n<p>Utility programs help protect, configure, analyze, and maintain computer systems.</p>\n<h3>Antivirus and backups</h3>\n<p>Antivirus tools detect and help prevent malicious software. Backup tools make copies of important data for recovery.</p>\n<h3>Memory testing</h3>\n<p>Memory testing software checks RAM for errors that may contribute to system instability.</p>\n<h3>Screen savers</h3>\n<p>The original material includes screen savers as utilities. Historically they helped protect certain displays; screen locking and sleep settings are generally more useful on modern devices.</p>\n<h3>Good maintenance practices</h3>\n<p>Install trusted updates, back up important documents, avoid suspicious downloads, check available storage, and use compatible drivers.</p>\n<figure><img src=\"assets/firstyear3-figure-08.png\" alt=\"Original illustration for chapter 10\" loading=\"lazy\"><figcaption>Original illustration from the supplied learning material</figcaption></figure>"
  },
  {
    "title": "Practical Learning Activities",
    "html": "<h1>PRACTICAL LEARNING ACTIVITIES</h1><h3>Activity 1: Hardware Identification</h3>\n<p>List five physical computer components and describe each function.</p>\n<h3>Activity 2: Input and Output</h3>\n<p>Classify keyboard, monitor, mouse, printer, microphone, speaker, webcam, projector, scanner, and headphones.</p>\n<h3>Activity 3: Internal Components</h3>\n<p>Compare CPU, RAM, ROM, and HDD in a four-row table.</p>\n<h3>Activity 4: Software Classification</h3>\n<p>Classify Windows, Word, Chrome, a printer driver, antivirus, Excel, Android, and a media player.</p>\n<h3>Activity 5: Operating System Exploration</h3>\n<p>Identify the operating system on a computer or phone and list five of its functions.</p>\n<h3>Activity 6: Maintenance Checklist</h3>\n<p>Write five practices that help protect and maintain a computer.</p>\n<h3>Activity 7: Reflection</h3>\n<p>In five to seven sentences, explain why hardware and software must work together.</p>"
  },
  {
    "title": "Glossary of Terms",
    "html": "<h1>Glossary of Terms</h1><p>Application software: Programs that help users perform specific tasks. Antivirus: Software that detects and helps prevent malicious software. Backup: A copy of important data for recovery. Booting: Starting a computer and loading the operating system. CPU: Central Processing Unit; executes instructions. Device driver: Software supporting communication with hardware. External hardware: Devices located outside the main computer unit. HDD: Hard Disk Drive; persistent storage. Hardware: Physical components of a computer. Input device: Hardware used to enter information. Internal hardware: Components inside the computer. Operating system: System software that manages hardware and applications. Output device: Hardware that presents information. Peripheral: An external computer device. RAM: Volatile working memory. ROM: Non-volatile memory often used for firmware. Software: Programs and instructions. System software: Programs that support and manage computer operations. Touchscreen: Display that also accepts touch input. Utility software: Software used for maintenance, protection, or management.</p>"
  },

    "title": "Learning Resources and References",
    "html": "<h1>Learning Resources and References</h1><p>Primary source: Computer Hardware and Software, six-page PDF provided by the user (firstyearb3.pdf). Original illustrations retained in the relevant chapters. BCcampus Open Education, Computer Hardware and Software: https://opentextbc.ca/computerstudies/chapter/computer-hardware-and-software/ GCFGlobal, Computer Basics: https://edu.gcfglobal.org/en/computerbasics/ Encyclopaedia Britannica, Computer: https://www.britannica.com/technology/computer</p>"

const status = document.getElementById('status');
const heading = document.getElementById('heading');
let current = 0;
function render() {
  const page = LESSON_PAGES[current];
  content.innerHTML = page.html;
  if (heading) heading.textContent = page.title;
  toc.replaceChildren();
  LESSON_PAGES.forEach((item, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = item.title;
    if (i === current) b.classList.add('active');
    b.addEventListener('click', () => go(i));
    toc.appendChild(b);
  });
  prev.disabled = current === 0;
  next.disabled = current === LESSON_PAGES.length - 1;
  if (status) status.textContent = `Section ${current + 1} of ${LESSON_PAGES.length}`;
}
function go(i) {
  if (i < 0 || i >= LESSON_PAGES.length) return;
  current = i;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
prev.addEventListener('click', () => go(current-1));
next.addEventListener('click', () => go(current+1));
render();


/* BYTEBLOOM - LIGHT AND DARK MODE */

(function () {
    const toggle = document.getElementById("themeToggle");
    const reader = document.querySelector(".reader");

    if (!toggle || !reader) return;

    const key = "bytebloom-reader-theme";

    function setTheme(mode) {
        const dark = mode === "dark";

        reader.classList.toggle("dark-mode", dark);

        toggle.textContent = dark
            ? "☀️ Light Mode"
            : "🌙 Dark Mode";

        toggle.setAttribute("aria-pressed", String(dark));
    }

    let saved = "light";

    try {
        saved = localStorage.getItem(key) || "light";
    } catch (_) {}

    setTheme(saved);

    toggle.addEventListener("click", function () {
        const mode = reader.classList.contains("dark-mode")
            ? "light"
            : "dark";

        setTheme(mode);

        try {
            localStorage.setItem(key, mode);
        } catch (_) {}
    });
})();

</script>
