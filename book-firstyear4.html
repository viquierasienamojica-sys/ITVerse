  <script>
const LESSON_PAGES = [
  {
    "title": "Book Introduction",
    "html": "<h1>INFORMATION PROCESSING CYCLE</h1><p>A Complete Beginner’s Guide to Input, Processing, Storage, Output, and Communication</p><h2>Book Introduction</h2>\n<p>Every computer, from a smartphone to a large server, handles information through five connected functions: input, processing, storage, output, and communication. This E-Book explains each stage in simple language, using examples from the supplied lesson.</p>\n<h2>Learning Objectives</h2>\n<p>• Identify the five stages of the information processing cycle.</p>\n<p>• Explain how data enters and is processed by a computer.</p>\n<p>• Describe temporary and longer-term storage.</p>\n<p>• Identify common output devices and explain their roles.</p>\n<p>• Describe communication between users, computers, and networks.</p>\n<p>• Trace the five stages through a WhatsApp message example.</p>\n<h2>Table of Contents</h2>\n<h2>Chapter 1: Understanding the Information Processing Cycle</h2>\n<h2>Chapter 2: Input: Entering Data into the Computer</h2>\n<h2>Chapter 3: Processing: Turning Data into Useful Results</h2>\n<h2>Chapter 4: Storage: Keeping Information</h2>\n<h2>Chapter 5: Output: Presenting Information</h2>\n<h2>Chapter 6: Communication: Connecting Users and Computers</h2>\n<h2>Chapter 7: Practical Example: Sending a WhatsApp Message</h2>\n<h2>Practical Learning Activities</h2>\n<p>Final Assessment (20 Questions) Chapter Quiz Answer Keys Final Assessment Answers and Explanations</p>\n<h2>Glossary</h2>\n<h2>References and Conclusion</h2>"
  },
  {
    "title": "Chapter 1: Understanding the Information Processing Cycle",
    "html": "<h2>CHAPTER 1: UNDERSTANDING THE INFORMATION PROCESSING CYCLE</h2>\n<h3>What Is the Information Processing Cycle?</h3>\n<p>The information processing cycle describes how a computer receives data, works with that data, stores information, presents results, and communicates with users or other computers. The source lesson identifies five main stages: input, processing, storage, output, and communication.</p>\n<h3>Why the Five Stages Matter</h3>\n<p>A smartphone and a powerful server may look different, but both use the same basic ideas. Devices work together to transform raw data into useful information. The stages are connected and may occur very quickly, sometimes almost at the same time.</p>\n<h3>A Simple Example</h3>\n<p>When a student types a letter, the keyboard provides input. The computer processes the keystroke, may hold it temporarily in memory, and displays the letter on the screen. If the document is saved, it is stored for later use. When shared online, communication connects the computer to another device.</p><figure><img src=\"assets/firstyear4-figure-01.png\" alt=\"Information processing cycle showing input, processing, output, communication and storage\" loading=\"lazy\"><figcaption>Figure 1.1: The five connected stages of the information processing cycle (original source diagram).</figcaption></figure>"
  },
  {
    "title": "Chapter 2: Input: Entering Data into the Computer",
    "html": "<h2>CHAPTER 2: INPUT: ENTERING DATA INTO THE COMPUTER</h2>\n<h3>What Is Input?</h3>\n<p>Input is the stage where data enters a computer. People can type, touch a screen, speak, or use other input devices. The computer represents incoming information digitally, using binary values (1s and 0s).</p>\n<h3>Common Input Devices</h3>\n<p>A keyboard enters letters and numbers. A touchscreen accepts taps and gestures. A microphone captures spoken words or sounds. These examples are specifically discussed in the original lesson.</p>\n<h3>From Actions to Data</h3>\n<p>When a user presses a key, the device sends a signal that the computer interprets. The resulting data can then be processed and displayed. For speech input, a microphone captures sound that software can process.</p>\n<h3>Everyday Example</h3>\n<p>Typing a search term in a web browser is an input action. Speaking a voice message into a smartphone is another input action.</p>"
  },
  {
    "title": "Chapter 3: Processing: Turning Data into Useful Results",
    "html": "<h2>CHAPTER 3: PROCESSING: TURNING DATA INTO USEFUL RESULTS</h2>\n<h3>What Is Processing?</h3>\n<p>Processing is the stage in which the computer works with the entered data. The central processing unit (CPU) executes instructions and performs calculations needed for computer tasks.</p>\n<h3>The Role of the CPU</h3>\n<p>The CPU works with memory to obtain instructions and manipulate data. For example, after a key is pressed, the computer processes that input so the correct character can appear on the screen.</p>\n<h3>Processing and Display</h3>\n<p>The original lesson describes a visual example where information is represented as pixels and displayed on a screen. This is one way processing produces a useful result; other results may be sound, text, or calculations.</p>\n<h3>Why Processing Is Fast</h3>\n<p>Modern computers can perform many operations in fractions of a second. This makes typing, browsing, and using applications feel almost immediate.</p>"
  },
  {
    "title": "Chapter 4: Storage: Keeping Information",
    "html": "<h2>CHAPTER 4: STORAGE: KEEPING INFORMATION</h2>\n<h3>What Is Storage?</h3>\n<p>Storage is the stage where a computer keeps data and information. The source explains a common sequence: data is placed in temporary memory (RAM), and when the user saves it, the information is written to a disk drive.</p>\n<h3>Temporary Storage: RAM</h3>\n<p>Random-access memory (RAM) holds working data while a computer is using it. In the lesson, the CPU writes data to RAM before it is saved to longer-term storage.</p>\n<h3>Saving to a Drive</h3>\n<p>When the user gives a save command, a program can write data to a disk drive. The file is stored in a default location or a location selected by the user, so it can be opened later.</p>\n<h3>External Storage</h3>\n<p>The source also mentions USB drives and external hard drives. These devices can hold files outside the computer’s built-in storage.</p>\n<h3>Example</h3>\n<p>A student types a report, saves it in a Documents folder, and later opens the same file. This illustrates the storage stage.</p>"
  },
  {
    "title": "Chapter 5: Output: Presenting Information",
    "html": "<h2>CHAPTER 5: OUTPUT: PRESENTING INFORMATION</h2>\n<h3>What Is Output?</h3>\n<p>Output is the stage where processed information is presented in a form that a person can use. The source describes visual output, printed output, and audio output.</p>\n<h3>Screens and Visual Output</h3>\n<p>A screen can display letters, pictures, and other visual information. In the original lesson, processed pixel information is displayed so the user can read or view it.</p>\n<h3>Printers and Audio Devices</h3>\n<p>A printer produces information on paper. Audio output devices turn digital information into sounds such as music or speech. Video devices also present visual results.</p>\n<h3>From Data to Information</h3>\n<p>Output makes processed data understandable. For example, letters in a document or the sound of a song are forms of information people can interpret.</p>"
  },
  {
    "title": "Chapter 6: Communication: Connecting Users and Computers",
    "html": "<h2>CHAPTER 6: COMMUNICATION: CONNECTING USERS AND COMPUTERS</h2>\n<h3>What Is Communication?</h3>\n<p>Communication links the information processing stages and allows information to move between a user and a computer or between computers. The source highlights the near-immediate relationship between input and output.</p>\n<h3>Communication with the User</h3>\n<p>When a person types a letter and sees it appear on the screen, input, processing, and output work together. This fast exchange is one form of interaction between the user and the computer.</p>\n<h3>Communication Across Networks</h3>\n<p>Computers can exchange information across networks. The original lesson describes the internet as a large network of connected computers and mentions company intranets and servers.</p>\n<h3>Web Browsing Example</h3>\n<p>When someone opens a web browser, the computer can communicate with other computers to request and receive information. The result is then presented to the user.</p>\n<h3>Why Communication Matters</h3>\n<p>Communication makes online messages, shared files, websites, and connected services possible.</p>"
  },
  {
    "title": "Chapter 7: Practical Example: Sending a WhatsApp Message",
    "html": "<h2>CHAPTER 7: PRACTICAL EXAMPLE: SENDING A WHATSAPP MESSAGE</h2>\n<h3>A Real-World Processing Cycle</h3>\n<p>The original source uses sending a WhatsApp message from a smartphone to show how the stages work together. A user opens the app, enters a message using the touch keyboard, and presses Send.</p>\n<h3>Input</h3>\n<p>Typing the message on the touchscreen provides input. The phone captures the characters that the user enters.</p>\n<h3>Processing</h3>\n<p>The smartphone and app process the message and prepare it for delivery. The conversation screen is updated to show the message.</p>\n<h3>Communication</h3>\n<p>The app communicates with servers to transmit the message. The message is delivered through connected systems to the intended recipient.</p>\n<h3>Storage</h3>\n<p>The source explains that conversation records can be stored on the sender’s phone, the recipient’s phone, and WhatsApp servers. Exact storage behavior may vary depending on the service and settings.</p>\n<h3>Output</h3>\n<p>The message appears in the conversation. The user can read it on the screen. This example shows that several stages can happen together.</p>\n<h3>Learning Takeaway</h3>\n<p>The information processing cycle is not limited to desktop computers. Smartphones and online messaging services use the same fundamental principles.</p>"
  },
  {
    "title": "Practical Learning Activities",
    "html": "<h2>PRACTICAL LEARNING ACTIVITIES</h2>\n<h3>Activity 1: Five-Stage Identification</h3>\n<p>Write the five stages of the information processing cycle. Give a one-sentence definition and one everyday example for each.</p>\n<h3>Activity 2: Input Device Observation</h3>\n<p>Identify three input devices around you. Explain what data each device sends to the computer.</p>\n<h3>Activity 3: Saving a Document</h3>\n<p>Create a short text document. Explain what happens in RAM and what happens when you save it to a drive.</p>\n<h3>Activity 4: Output Devices</h3>\n<p>Compare a monitor, printer, and speaker. Explain what information each presents to users.</p>\n<h3>Activity 5: Network Communication</h3>\n<p>Describe how a web browser communicates with other computers when you open a website.</p>\n<h3>Activity 6: WhatsApp Cycle</h3>\n<p>Trace a WhatsApp message from typing to sending, viewing, and storage. Label each stage of the cycle.</p>\n<h3>Activity 7: Reflection</h3>\n<p>Write five to seven sentences about why the five information processing stages are important in everyday life.</p>"
  },
  {
    "title": "Glossary",
    "html": "<h1>Glossary</h1><p>Binary code: A way of representing computer information using 0s and 1s. Communication: Exchange of information between a user and computer or across computers. CPU: Central Processing Unit; executes instructions and processes data. Data: Raw facts or values entered into a computer. Disk drive: A device that stores files for later use. Information: Data presented in a meaningful or useful form. Input: Entering data into a computer. Input device: Hardware such as a keyboard, touchscreen, or microphone used to enter data. Internet: A worldwide network of connected computer networks. Output: Presentation of processed information to a user. Pixel: A small element of a digital image on a display. Processing: Computer operations that transform or work with data. RAM: Random-access memory used for temporary working data. Server: A computer or service that provides resources to other computers. Storage: Keeping data and information for use later. USB drive: A removable device used to store files.</p>"
  },
  {
    "title": "References",
    "html": "<h1>References</h1><h3>Primary source: Information processing cycle, supplied four-page learning material (1stbook4.pdf).</h3>\n<h3>Source reference provided in the original material: Siyavula, Computer Applications Technology,</h3>\n<p>Grade 11, General Concepts of Computing. https://www.siyavula.com/read/za/computer-applications- technology/grade-11/general-concepts-of-computing/01-general-concepts-of-computing</p>"
  },
  {
    "title": "Conclusion",
    "html": "<h1>Conclusion</h1><p>The five stages of the information processing cycle—input, processing, storage, output, and communication—work together in many everyday computing tasks. Whether typing a document, saving a file, browsing the internet, or sending a message, computers receive data, process it, store it, present useful information, and communicate with connected systems. Understanding these stages provides a foundation for learning about computer hardware, software, and networks.</p>"
  }
];

const toc = document.getElementById('toc');
const content = document.getElementById('content');
const prev = document.getElementById('prev') || document.getElementById('previous');
const next = document.getElementById('next');
const status = document.getElementById('status');
const heading = document.getElementById('heading');
let current = 0;
function render() {
  const page = LESSON_PAGES[current];
  content.innerHTML = page.html;
  if (heading) heading.textContent = page.title;
  toc.replaceChildren();
  LESSON_PAGES.forEach((item, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = item.title;
    if (i === current) b.classList.add('active');
    b.addEventListener('click', () => go(i));
    toc.appendChild(b);
  });
  prev.disabled = current === 0;
  next.disabled = current === LESSON_PAGES.length - 1;
  if (status) status.textContent = `Section ${current + 1} of ${LESSON_PAGES.length}`;
}
function go(i) {
  if (i < 0 || i >= LESSON_PAGES.length) return;
  current = i;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
prev.addEventListener('click', () => go(current-1));
next.addEventListener('click', () => go(current+1));
render();

/* BYTEBLOOM - LIGHT AND DARK MODE */

(function () {
    const toggle = document.getElementById("themeToggle");
    const reader = document.querySelector(".reader");

    if (!toggle || !reader) return;

    const key = "bytebloom-reader-theme";

    function setTheme(mode) {
        const dark = mode === "dark";

        reader.classList.toggle("dark-mode", dark);

        toggle.textContent = dark
            ? "☀️ Light Mode"
            : "🌙 Dark Mode";

        toggle.setAttribute("aria-pressed", String(dark));
    }

    let saved = "light";

    try {
        saved = localStorage.getItem(key) || "light";
    } catch (_) {}

    setTheme(saved);

    toggle.addEventListener("click", function () {
        const mode = reader.classList.contains("dark-mode")
            ? "light"
            : "dark";

        setTheme(mode);

        try {
            localStorage.setItem(key, mode);
        } catch (_) {}
    });
})();
