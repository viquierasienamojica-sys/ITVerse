  <script>
const LESSON_PAGES = [
  {
    "title": "Book Introduction",
    "html": "<h1>NUMBER SYSTEMS AND DATA REPRESENTATION</h1><p><strong>First Year – Book 05 · Introduction to Computing</strong></p><p>A Beginner-Friendly Guide with Worked Conversions, Practice Activities, Chapter Quizzes, and Final Assessment.</p><h2>Book Introduction</h2><p>Digital computers store and process information using binary patterns. This book explains how numbers and symbols are represented and how to convert values between the binary, decimal, octal, and hexadecimal number systems.</p><h2>General Learning Objectives</h2><ul><li>Describe binary information, registers, data, and control information.</li><li>Identify the base and valid digits of four common number systems.</li><li>Use positional weights to interpret numbers.</li><li>Convert binary numbers to decimal, octal, and hexadecimal.</li><li>Convert decimal numbers to binary, octal, and hexadecimal.</li><li>Check conversion results and explain their use in computing.</li></ul>"
  },
  {
    "title": "Chapter 1: Data Representation in Digital Computers",
    "html": "<h1>Chapter 1: Data Representation in Digital Computers</h1><h3>Learning Objectives</h3>\n<p>Explain registers, binary-coded data, control information, and why computers use binary.</p>\n<h3>1.1 Data and control information</h3>\n<p>The source lesson explains that binary information is stored in memory or processor registers. A register is a small storage location in a processor. Registers can hold data (such as numbers or encoded characters) or control information (bits used to direct operations).</p>\n<h3>1.2 Why binary?</h3>\n<p>Digital storage circuits commonly distinguish two stable states. We represent these as 0 and 1, called bits. A group of eight bits is called a byte. Patterns of bits can represent numbers, letters, and other symbols.</p>\n<h3>1.3 Categories of data</h3>\n<p>The original lesson groups register data into numbers used in arithmetic, alphabetic letters used in data processing, and other discrete symbols. Letters and symbols require an encoding convention; for example, ASCII and Unicode define ways to represent text digitally. This encoding detail is additional explanatory context.</p>\n<h3>1.4 A simple example</h3>\n<p class=\"example\">Binary pattern: 01000001</p>\n<p>Under ASCII, the eight-bit pattern 01000001 represents the uppercase letter A. The same bits could be interpreted differently under another data format. Context matters.</p>"
  },
  {
    "title": "Chapter 2: Introduction to Number Systems",
    "html": "<h1>Chapter 2: Introduction to Number Systems</h1><h3>Learning Objectives</h3>\n<p>Identify bases, digits, and positional values of the four common number systems.</p>\n<h3>2.1 Base or radix</h3>\n<p>A number system has a base, also called its radix. In a positional number system, each digit is multiplied by a power of the base. The rightmost position has weight base to the power 0.</p>\n<div class=\"table-wrap\"><table><tr><th>System</th><th>Base</th><th>Valid digits</th><th>Example</th></tr><tr><td>Binary</td><td>2</td><td>0, 1</td><td>1011 (base 2)</td></tr><tr><td>Decimal</td><td>10</td><td>0–9</td><td>27 (base 10)</td></tr><tr><td>Octal</td><td>8</td><td>0–7</td><td>35 (base 8)</td></tr><tr><td>Hexadecimal</td><td>16</td><td>0–9, A–F</td><td>2F (base 16)</td></tr></table></div>\n<h3>2.2 Positional weights</h3>\n<p class=\"example\">Binary 1011 = 1×8 + 0×4 + 1×2 + 1×1 = 11</p>\n<p class=\"example\">Decimal 253 = 2×100 + 5×10 + 3×1 = 253</p>\n<p class=\"example\">Octal 17 = 1×8 + 7×1 = 15 in decimal</p>\n<p class=\"example\">Hex 2F = 2×16 + 15×1 = 47 in decimal</p>\n<h3>2.3 Hexadecimal letters</h3>\n<p>Hexadecimal uses A=10, B=11, C=12, D=13, E=14, and F=15. Octal and hexadecimal are useful shorthand for long binary strings.</p>"
  },
  {
    "title": "Chapter 3: Binary and Decimal Conversion",
    "html": "<h1>Chapter 3: Binary and Decimal Conversion</h1><h3>Learning Objectives</h3>\n<p>Convert binary values into decimal using powers of two and verify results.</p>\n<h3>3.1 Positional-weight method</h3>\n<p>Write the powers of two from right to left, multiply each bit by its corresponding weight, and add the results.</p>\n<p class=\"example\">1101 (base 2) = 1×8 + 1×4 + 0×2 + 1×1 = 13 (base 10)</p>\n<p class=\"example\">1100110101 (base 2) = 512 + 256 + 32 + 16 + 4 + 1 = 821 (base 10)</p>\n<h3>3.2 Quick table</h3>\n<div class=\"table-wrap\"><table><tr><th>Binary position</th><th>9</th><th>8</th><th>7</th><th>6</th><th>5</th><th>4</th><th>3</th><th>2</th><th>1</th><th>0</th></tr><tr><td>Power of 2</td><td>512</td><td>256</td><td>128</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr><tr><td>Bit</td><td>1</td><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td><td>0</td><td>1</td></tr></table></div>\n<h3>3.3 Check your work</h3>\n<p>Only add the weights where the bit is 1. For example, 10101 in binary equals 16 + 4 + 1 = 21 in decimal.</p>"
  },
  {
    "title": "Chapter 4: Binary and Octal Conversion",
    "html": "<h1>Chapter 4: Binary and Octal Conversion</h1><h3>Learning Objectives</h3>\n<p>Convert binary to octal by grouping bits into sets of three.</p>\n<h3>4.1 Three-bit groups</h3>\n<p>Starting at the right, divide the binary digits into groups of three. Add leading zeros to the leftmost group if needed. Convert each group to an octal digit.</p>\n<div class=\"table-wrap\"><table><tr><th>Binary</th><th>000</th><th>001</th><th>010</th><th>011</th><th>100</th><th>101</th><th>110</th><th>111</th></tr><tr><td>Octal</td><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr></table></div>\n<h3>4.2 Worked examples</h3>\n<p class=\"example\">100110110001010 → 100 | 110 | 110 | 001 | 010 → 46612 (base 8)</p>\n<p class=\"example\">01110001 → 001 | 110 | 001 → 161 (base 8)</p>\n<p>The second example pads the leftmost group with a zero: 01 becomes 001. Leading zeros do not change the value.</p>\n<h3>4.3 Reverse conversion</h3>\n<p class=\"example\">Octal 57 → 5 = 101, 7 = 111 → binary 101111</p>"
  },
  {
    "title": "Chapter 5: Binary and Hexadecimal Conversion",
    "html": "<h1>Chapter 5: Binary and Hexadecimal Conversion</h1><h3>Learning Objectives</h3>\n<p>Convert binary to hexadecimal using four-bit groups and interpret hexadecimal letters.</p>\n<h3>5.1 Four-bit groups</h3>\n<p>Starting at the right, group binary digits in sets of four. Add leading zeros if necessary. Replace each group with its hexadecimal digit.</p>\n<div class=\"table-wrap\"><table><tr><th>Binary</th><th>Hex</th></tr><tr><td>0000</td><td>0</td></tr><tr><td>0001</td><td>1</td></tr><tr><td>0010</td><td>2</td></tr><tr><td>0011</td><td>3</td></tr><tr><td>0100</td><td>4</td></tr><tr><td>0101</td><td>5</td></tr><tr><td>0110</td><td>6</td></tr><tr><td>0111</td><td>7</td></tr><tr><td>1000</td><td>8</td></tr><tr><td>1001</td><td>9</td></tr><tr><td>1010</td><td>A</td></tr><tr><td>1011</td><td>B</td></tr><tr><td>1100</td><td>C</td></tr><tr><td>1101</td><td>D</td></tr><tr><td>1110</td><td>E</td></tr><tr><td>1111</td><td>F</td></tr></table></div>\n<h3>5.2 Worked examples</h3>\n<p class=\"example\">10101111 → 1010 | 1111 → AF (base 16)</p>\n<p class=\"example\">11010100 → 1101 | 0100 → D4 (base 16)</p>\n<p class=\"example\">10111010100 → 0101 | 1101 | 0100 → 5D4 (base 16)</p>\n<h3>5.3 Common use</h3>\n<p>Hexadecimal is a compact way to write binary data. For example, one byte (8 bits) can be written as two hexadecimal digits.</p>"
  },
  {
    "title": "Chapter 6: Decimal to Binary, Octal, and Hexadecimal",
    "html": "<h1>Chapter 6: Decimal to Binary, Octal, and Hexadecimal</h1><h3>Learning Objectives</h3>\n<p>Use repeated division to convert decimal numbers and convert the result to octal or hexadecimal.</p>\n<h3>6.1 Repeated division by two</h3>\n<p>Divide the decimal number by 2 repeatedly. Record each remainder. Read the remainders from bottom to top to obtain the binary representation.</p>\n<div class=\"table-wrap\"><table><tr><th>Division</th><th>Quotient</th><th>Remainder</th></tr><tr><td>1492 ÷ 2</td><td>746</td><td>0</td></tr><tr><td>746 ÷ 2</td><td>373</td><td>0</td></tr><tr><td>373 ÷ 2</td><td>186</td><td>1</td></tr><tr><td>186 ÷ 2</td><td>93</td><td>0</td></tr><tr><td>93 ÷ 2</td><td>46</td><td>1</td></tr><tr><td>46 ÷ 2</td><td>23</td><td>0</td></tr><tr><td>23 ÷ 2</td><td>11</td><td>1</td></tr><tr><td>11 ÷ 2</td><td>5</td><td>1</td></tr><tr><td>5 ÷ 2</td><td>2</td><td>1</td></tr><tr><td>2 ÷ 2</td><td>1</td><td>0</td></tr><tr><td>1 ÷ 2</td><td>0</td><td>1</td></tr></table></div>\n<p class=\"example\">1492 (base 10) = 10111010100 (base 2)</p>\n<h3>6.2 Convert decimal to octal</h3>\n<p>The source lesson converts decimal to binary first, then groups the bits into threes. This is a valid method.</p>\n<p class=\"example\">1492 (base 10) → 10111010100 (base 2)</p>\n<p class=\"example\">010 | 111 | 010 | 100 → 2724 (base 8)</p>\n<h3>6.3 Convert decimal to hexadecimal</h3>\n<p>Group the same binary value into sets of four from the right.</p>\n<p class=\"example\">1492 (base 10) → 10111010100 (base 2)</p>\n<p class=\"example\">0101 | 1101 | 0100 → 5D4 (base 16)</p>\n<h3>6.4 Verify the conversion</h3>\n<p class=\"example\">Octal 2724 = 2×512 + 7×64 + 2×8 + 4 = 1492</p>\n<p class=\"example\">Hex 5D4 = 5×256 + 13×16 + 4 = 1492</p>"
  },
  {
    "title": "Chapter 7: Conversion Practice and Applications",
    "html": "<h1>Chapter 7: Conversion Practice and Applications</h1><h3>Learning Objectives</h3>\n<p>Choose efficient conversion methods and verify answers across bases.</p>\n<h3>7.1 Choosing a method</h3>\n<p>Use powers of two for binary-to-decimal conversion. Use three-bit grouping for binary-to-octal conversion and four-bit grouping for binary-to-hexadecimal conversion. For decimal-to-binary conversion, use repeated division by 2. These procedures cover the conversion methods in the original source.</p>\n<h3>7.2 Worked multi-base example</h3>\n<p class=\"example\">Binary 11110000 = decimal 240</p>\n<p class=\"example\">Binary 11110000 → 011 | 110 | 000 = octal 360</p>\n<p class=\"example\">Binary 11110000 → 1111 | 0000 = hexadecimal F0</p>\n<p class=\"example\">Check: 3×64 + 6×8 = 240; F0 = 15×16 = 240.</p>\n<h3>7.3 Frequent mistakes</h3>\n<p>Common mistakes include grouping from the wrong side, forgetting leading zero padding, using invalid digits for a base, reading division remainders in the wrong direction, and confusing hexadecimal letters with decimal digits.</p>\n<h3>7.4 Why this matters</h3>\n<p>Binary is fundamental to digital computing. Octal and hexadecimal shorten binary representations, making them easier to read in programming and technical documentation.</p>"
  },

const toc = document.getElementById('toc');
const content = document.getElementById('content');
const prev = document.getElementById('prev') || document.getElementById('previous');
const next = document.getElementById('next');
const status = document.getElementById('status');
const heading = document.getElementById('heading');
let current = 0;
function render() {
  const page = LESSON_PAGES[current];
  content.innerHTML = page.html;
  if (heading) heading.textContent = page.title;
  toc.replaceChildren();
  LESSON_PAGES.forEach((item, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = item.title;
    if (i === current) b.classList.add('active');
    b.addEventListener('click', () => go(i));
    toc.appendChild(b);
  });
  prev.disabled = current === 0;
  next.disabled = current === LESSON_PAGES.length - 1;
  if (status) status.textContent = `Section ${current + 1} of ${LESSON_PAGES.length}`;
}
function go(i) {
  if (i < 0 || i >= LESSON_PAGES.length) return;
  current = i;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
prev.addEventListener('click', () => go(current-1));
next.addEventListener('click', () => go(current+1));
render();

/* BYTEBLOOM - LIGHT AND DARK MODE */

(function () {
    const toggle = document.getElementById("themeToggle");
    const reader = document.querySelector(".reader");

    if (!toggle || !reader) return;

    const key = "bytebloom-reader-theme";

    function setTheme(mode) {
        const dark = mode === "dark";

        reader.classList.toggle("dark-mode", dark);

        toggle.textContent = dark
            ? "☀️ Light Mode"
            : "🌙 Dark Mode";

        toggle.setAttribute("aria-pressed", String(dark));
    }

    let saved = "light";

    try {
        saved = localStorage.getItem(key) || "light";
    } catch (_) {}

    setTheme(saved);

    toggle.addEventListener("click", function () {
        const mode = reader.classList.contains("dark-mode")
            ? "light"
            : "dark";

        setTheme(mode);

        try {
            localStorage.setItem(key, mode);
        } catch (_) {}
    });
})();

</script>
