  <script>
    const LESSON_PAGES = [
      {
        "title": "Introduction",
        "html": "<figure><img src=\"assets/firstyear6-figure-01.png\" alt=\"User application operating system hardware diagram\"><figcaption>Original diagram from PDF page 1: user, application, operating system, and hardware.</figcaption></figure><p>An operating system makes it possible for people and programs to use computer hardware efficiently. This book expands the supplied eight-page lesson into seven beginner-friendly chapters, with practical examples, short activities, and assessments.</p>\n<h3>Learning Objectives</h3>\n<p></p><ul><li>Explain the role of an operating system and kernel.</li><li>Distinguish hardware, system programs, and applications.</li><li>Compare GUI, CLI, and shell.</li><li>Identify primary and secondary OS goals.</li><li>Describe process, memory, file, device, and security management.</li><li>Recognize common operating systems.</li><li>Compare operating systems using cost, usability, compatibility, and security.</li></ul><p></p>"
      },
      {
        "title": "Chapter 1: Understanding Operating Systems",
        "html": "<h3>What Is an Operating System?</h3>\n<p>An operating system (OS) is system software that acts as an intermediary between computer hardware and the user or application programs. It provides an environment where programs can run and where hardware can be used in an organized way.</p>\n<h3>How the Layers Work</h3>\n<p>A person uses an application, such as a text editor. The application requests services from the operating system. The OS coordinates with hardware such as the CPU, memory, and storage devices. The results return to the application and then to the user. The Kernel The kernel is the core part of the OS. It stays active while the system is running and manages essential resources and services. For example, it helps decide which process uses the processor and which memory areas are available.</p>\n<h3>Everyday Example</h3>\n<p>When you open a document, the application asks the OS to access the file. The OS works with storage and memory, then the application displays the document.</p>\n<h3>Chapter Summary</h3>\n<p>Key ideas: what is an operating system?, how the layers work, the kernel, everyday example.</p>"
      },
      {
        "title": "Chapter 2: Computer System Components And Programs",
        "html": "<figure><img src=\"assets/firstyear6-figure-02.png\" alt=\"Computer system layers diagram\"><figcaption>Original diagram from PDF page 5: users, programs, OS, and hardware.</figcaption></figure><p>Original illustration: multiple users, system and application programs, operating system, and hardware.</p>\n<h3>Four Major Parts</h3>\n<p>A general-purpose computer system includes hardware, an operating system, system programs, and application programs. Each has a different responsibility, but all work together.</p>\n<h3>Hardware</h3>\n<p>Hardware includes the CPU, main memory, storage devices, keyboards, monitors, printers, and other input/output devices. Hardware carries out physical operations.</p>\n<h3>System Programs</h3>\n<p>System programs help manage or support computer use. Examples from the source include compilers, assemblers, loaders, editors, utilities, and command interpreters.</p>\n<h3>Application Programs</h3>\n<p>Applications perform tasks for users, such as writing reports, viewing websites, and working with databases. They rely on OS services to use hardware.</p>\n<h3>Example</h3>\n<p>A student types a report in a word processor (application). The OS coordinates keyboard input, memory use, and saving to storage (hardware).</p>\n<h3>Chapter Summary</h3>\n<p>Key ideas: four major parts, hardware, system programs, application programs.</p>"
      },
      {
        "title": "Chapter 3: User Interaction: Gui, Cli, And Shell",
        "html": "<h3>How Users Interact</h3>\n<p>An operating system provides ways to interact with the computer. Two common interfaces are the graphical user interface (GUI) and command-line interface (CLI).</p>\n<h3>Graphical User Interface</h3>\n<p>A GUI uses windows, icons, menus, and pointers. Examples include the Windows desktop and macOS Finder. Users can click or tap to perform actions.</p>\n<h3>Command-Line Interface</h3>\n<p>A CLI accepts typed commands. Examples include Bash and PowerShell. A command may open a folder, list files, or run a program.</p>\n<h3>Shell and Kernel</h3>\n<p>A shell interprets user commands and invokes appropriate programs or system services. The kernel handles lower-level operations such as managing CPU time, memory, and devices. A shell is not the same as the kernel.</p>\n<h3>Choosing an Interface</h3>\n<p>A GUI may be easier for beginners, while a CLI is useful for automation and precise commands. Many operating systems support both.</p>\n<h3>Chapter Summary</h3>\n<p>Key ideas: how users interact, graphical user interface, command-line interface, shell and kernel.</p>"
      },
      {
        "title": "Chapter 4: Goals Of An Operating System",
        "html": "<h3>Primary Goals</h3>\n<p>The source describes user convenience, program execution, resource management, and security as primary goals of an OS.</p>\n<h3>Convenience and Execution</h3>\n<p>The OS should make it practical to run programs. It offers interfaces and services so users do not need to control every hardware operation directly.</p>\n<h3>Resource Management</h3>\n<p>CPU time, memory, disk space, and input/output devices are shared resources. The OS allocates them to processes and coordinates their use.</p>\n<h3>Security</h3>\n<p>An OS helps protect files and services using authentication, authorization, access controls, and isolation. Security also depends on updates and responsible user behavior.</p>\n<h3>Secondary Goals</h3>\n<p>Efficient resource utilization and reliability are additional goals. A reliable OS aims to handle errors gracefully and keep the computer stable.</p>\n<h3>Chapter Summary</h3>\n<p>Key ideas: primary goals, convenience and execution, resource management, security.</p>"
      },
      {
        "title": "Chapter 5: Core Os Functions",
        "html": "<h3>Process and Multitasking Management</h3>\n<p>A process is a running program. The OS schedules processor time among processes so several tasks can make progress. Multitasking does not mean every process always runs on a separate CPU.</p>\n<h3>Memory Management</h3>\n<p>The OS tracks and allocates memory to programs, helping prevent unrelated processes from interfering with one another.</p>\n<h3>File and Storage Management</h3>\n<p>The OS organizes stored information into files and folders, supports saving and opening files, and controls access to storage.</p>\n<h3>Device and I/O Management</h3>\n<p>The OS coordinates keyboards, monitors, printers, storage drives, and other devices. Device drivers help the OS communicate with particular hardware.</p>\n<h3>Security and Isolation</h3>\n<p>The OS uses accounts, permissions, and isolation mechanisms to help keep applications and user data protected.</p>\n<h3>Chapter Summary</h3>\n<p>Key ideas: process and multitasking management, memory management, file and storage management, device and i/o management.</p>"
      },
      {
        "title": "Chapter 6: Common Operating Systems",
        "html": "<h3>Microsoft Windows</h3>\n<p>Windows is developed by Microsoft and is widely used on personal computers, in businesses, and for gaming.</p>\n<h3>Apple macOS</h3>\n<p>macOS is developed by Apple and used on supported Mac computers, including for everyday work and creative tasks.</p>\n<h3>Linux</h3>\n<p>Linux-based operating systems are developed by many communities and organizations. They are common in servers, development environments, embedded systems, and desktop computers.</p>\n<h3>Unix and Unix-like Systems</h3>\n<p>Unix originated at AT&amp;T Bell Labs. Unix and Unix-like systems are used in research, servers, workstations, and other professional settings.</p>\n<h3>What They Share</h3>\n<p>Although interfaces and supported software differ, these systems provide core OS services such as running applications, managing files, and coordinating hardware.</p>\n<h3>Chapter Summary</h3>\n<p>Key ideas: microsoft windows, apple macos, linux, unix and unix-like systems.</p>"
      },
      {
        "title": "Chapter 7: Choosing The Right Operating System",
        "html": "<h3>Cost</h3>\n<p>Some Linux distributions can be used without a license fee, while other operating systems or editions may have licensing costs or hardware requirements.</p>\n<h3>Ease of Use</h3>\n<p>Choose an interface that fits the user&#x27;s skills and needs. Familiarity, accessibility, and available learning materials can make an OS easier to use.</p>\n<h3>Compatibility</h3>\n<p>Check that important applications, printers, drivers, and other hardware work with the operating system before choosing it.</p>\n<h3>Security</h3>\n<p>Look for regular security updates, account protection, permissions, and appropriate configuration. No operating system is automatically safe without proper maintenance.</p>\n<h3>Practical Comparison</h3>\n<p>A student may choose an OS that runs required school applications. A developer may prefer one that supports needed programming tools. An organization may prioritize compatibility, support, and security.</p>\n<h3>Decision Checklist</h3>\n<p>Identify your essential applications, hardware, budget, support needs, and security requirements. Compare choices using those criteria rather than choosing by popularity alone.</p>\n<h3>Chapter Summary</h3>\n<p>Key ideas: cost, ease of use, compatibility, security.</p>"
      },

        "title": "Practical Learning Activities",

    const toc = document.getElementById('toc');
    const content = document.getElementById('content');
    const prev = document.getElementById('prev') || document.getElementById('previous');
    const next = document.getElementById('next');
    const status = document.getElementById('status');
    const heading = document.getElementById('heading');
    let current = 0;
    function render() {
      const page = LESSON_PAGES[current];
      content.innerHTML = page.html;
      if (heading) heading.textContent = page.title;
      toc.replaceChildren();
      LESSON_PAGES.forEach((item, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = item.title;
        if (i === current) b.classList.add('active');
        b.addEventListener('click', () => go(i));
        toc.appendChild(b);
      });
      prev.disabled = current === 0;
      next.disabled = current === LESSON_PAGES.length - 1;
      if (status) status.textContent = `Section ${current + 1} of ${LESSON_PAGES.length}`;
    }
    function go(i) {
      if (i < 0 || i >= LESSON_PAGES.length) return;
      current = i;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    prev.addEventListener('click', () => go(current - 1));
    next.addEventListener('click', () => go(current + 1));
    render();

    /* BYTEBLOOM - LIGHT AND DARK MODE */

    (function () {
      const toggle = document.getElementById("themeToggle");
      const reader = document.querySelector(".reader");

      if (!toggle || !reader) return;

      const key = "bytebloom-reader-theme";

      function setTheme(mode) {
        const dark = mode === "dark";

        reader.classList.toggle("dark-mode", dark);

        toggle.textContent = dark
          ? "☀️ Light Mode"
          : "🌙 Dark Mode";

        toggle.setAttribute("aria-pressed", String(dark));
      }

      let saved = "light";

      try {
        saved = localStorage.getItem(key) || "light";
      } catch (_) { }

      setTheme(saved);

      toggle.addEventListener("click", function () {
        const mode = reader.classList.contains("dark-mode")
          ? "light"
          : "dark";

        setTheme(mode);

        try {
          localStorage.setItem(key, mode);
        } catch (_) { }
      });
    })();

  </script>
