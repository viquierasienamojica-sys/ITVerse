  <script>
const LESSON_PAGES = [
  {
    "title": "Book Introduction",
    "html": "<h1>Programs and Processes</h1><p><strong>First Year · Book 07</strong></p><h2>Introduction</h2><p>Programs and processes are related but different concepts. A program is a set of stored instructions. A process is an active instance of those instructions running under operating-system management. This book expands the topics in the supplied 52-page reading into structured, beginner-friendly lessons and original practice questions. Learning Objectives • Explain how programs differ from processes. • Identify process states, scheduling, and resource management. • Describe IPC, synchronization, and memory isolation. • Discuss performance, security, maintenance, and scalability. • Apply these concepts to browsers, games, and other applications.</p>"
  },
  {
    "title": "Chapter 1: Programs: Instructions and Design",
    "html": "<h1>Chapter 1: Programs: Instructions and Design</h1><figure><img src=\"assets/firstyear7-figure-01.png\" alt=\"Original comparison figure for chapter 1\" loading=\"lazy\"><figcaption>Original comparison figure from the supplied PDF (page 3)</figcaption></figure><h3>What Is a Program?</h3>\n<p>A program is a stored collection of instructions designed to perform a task. It can be a text editor, game, web browser, or utility. The instructions remain available on storage even when the program is not running.</p>\n<h3>Program Structure</h3>\n<p>Programs use variables, conditions, loops, and functions to organize work. A simple calculator program reads two numbers, chooses an operation, and displays the result.</p>\n<h3>Compilation and Interpretation</h3>\n<p>Some development tools compile source code into executable form before running it. Others use interpreters or virtual machines. The details depend on the language and runtime; many systems combine these approaches.</p>\n<h3>Modularity and Reuse</h3>\n<p>Developers often divide software into smaller modules. A login module, for example, may be reused across several applications. This can make testing and maintenance easier.</p>\n<h3>Input, Output, and Errors</h3>\n<p>Programs may read keyboard input, files, or network messages and then show results or save data. Error handling lets a program report problems and recover when possible.</p>\n<h3>Chapter Recap</h3>\n<p>Remember: what is a program?; program structure; compilation and interpretation.</p>"
  },
  {
    "title": "Chapter 2: Processes: Programs in Execution",
    "html": "<h1>Chapter 2: Processes: Programs in Execution</h1><figure><img src=\"assets/firstyear7-figure-02.png\" alt=\"Original comparison figure for chapter 2\" loading=\"lazy\"><figcaption>Original comparison figure from the supplied PDF (page 5)</figcaption></figure><h3>What Is a Process?</h3>\n<p>A process is a running instance of a program. When an application starts, the operating system creates or manages a process with execution state and access to resources.</p>\n<h3>One Program, Many Processes</h3>\n<p>The same program may have several running instances. For example, two separate launches of an editor may create two processes, each working on a different document.</p>\n<h3>Process Resources</h3>\n<p>A process commonly has an address space, open files, access to devices, and scheduling information. The operating system tracks and manages these resources.</p>\n<h3>Program Versus Process</h3>\n<p>A program is stored instructions; a process is an active execution of those instructions. Closing a process does not normally delete the installed program.</p>\n<h3>Practical Example</h3>\n<p>A browser application is a program. When it is opened, one or more processes may run to display pages and perform background tasks. The exact process layout varies by browser.</p>\n<h3>Chapter Recap</h3>\n<p>Remember: what is a process?; one program, many processes; process resources.</p>"
  },
  {
    "title": "Chapter 3: Process States and Life Cycle",
    "html": "<h1>Chapter 3: Process States and Life Cycle</h1><h3>Creation</h3>\n<p>A process begins when the operating system creates an execution context for a program and assigns initial resources.</p>\n<h3>Ready</h3>\n<p>A ready process can run but is waiting to receive processor time.</p>\n<h3>Running</h3>\n<p>A running process is currently executing on a processor. On a multi-core machine, multiple processes may run at once.</p>\n<h3>Waiting or Blocked</h3>\n<p>A waiting process cannot continue until an event occurs, such as receiving input from a file or network.</p>\n<h3>Termination</h3>\n<p>A process ends when it finishes, exits because of an error, or is stopped. The OS reclaims many of its resources.</p>\n<h3>A Typical Flow</h3>\n<p>Created -&gt; Ready -&gt; Running -&gt; Waiting -&gt; Ready -&gt; Running -&gt; Terminated. Real operating systems may have additional states and transitions.</p>\n<h3>Chapter Recap</h3>\n<p>Remember: creation; ready; running.</p>"
  },
  {
    "title": "Chapter 4: Process Management and Execution",
    "html": "<h1>Chapter 4: Process Management and Execution</h1><h3>Scheduling</h3>\n<p>The OS scheduler selects which ready process should use the CPU. Scheduling aims to share processor time and keep the system responsive.</p>\n<h3>Context Switching</h3>\n<p>When the CPU switches from one running task to another, the system saves and restores execution context. This supports multitasking but takes some time.</p>\n<h3>CPU Time and I/O</h3>\n<p>A process may spend some time computing and other time waiting for input or output. The scheduler can give CPU time to other ready processes while one waits.</p>\n<h3>Multitasking</h3>\n<p>Multitasking means that several tasks make progress over time. Concurrency does not always require simultaneous execution on separate cores.</p>\n<h3>Monitoring</h3>\n<p>Task Manager or system-monitoring tools can show process names, CPU use, and memory use. These measurements help diagnose slowdowns.</p>\n<h3>Chapter Recap</h3>\n<p>Remember: scheduling; context switching; cpu time and i/o.</p>"
  },
  {
    "title": "Chapter 5: Inter-Process Communication and Synchronization",
    "html": "<h1>Chapter 5: Inter-Process Communication and Synchronization</h1><figure><img src=\"assets/firstyear7-figure-03.png\" alt=\"Original comparison figure for chapter 5\" loading=\"lazy\"><figcaption>Original comparison figure from the supplied PDF (page 11)</figcaption></figure><p>SYNCHRONIZATION</p>\n<h3>Why Processes Communicate</h3>\n<p>Separate processes may need to exchange data or coordinate work. For example, one service may send information to another.</p>\n<h3>IPC Methods</h3>\n<p>Common inter-process communication methods include pipes, message passing, shared memory, and network sockets. Each has different tradeoffs.</p>\n<h3>Shared Memory</h3>\n<p>Shared memory lets cooperating processes access a common region of memory. Because multiple processes may access it, coordination is important.</p>\n<h3>Synchronization</h3>\n<p>Synchronization prevents conflicting changes to shared data. Locks, semaphores, and condition variables are examples of tools that can coordinate access.</p>\n<h3>Race Conditions</h3>\n<p>A race condition happens when a result depends on the timing of concurrent operations. For example, two processes updating the same counter without coordination may lose an update.</p>\n<h3>Chapter Recap</h3>\n<p>Remember: why processes communicate; ipc methods; shared memory.</p>"
  },
  {
    "title": "Chapter 6: Memory Management and Address Spaces",
    "html": "<h1>Chapter 6: Memory Management and Address Spaces</h1><figure><img src=\"assets/firstyear7-figure-04.png\" alt=\"Original comparison figure for chapter 6\" loading=\"lazy\"><figcaption>Original comparison figure from the supplied PDF (page 13)</figcaption></figure><h3>Address Space</h3>\n<p>A process normally has a virtual address space containing its code, data, stack, and other regions. This is a property of the running process, not merely the stored program file.</p>\n<h3>Memory Isolation</h3>\n<p>The OS and hardware help isolate processes so one process cannot freely read or change another process’s memory.</p>\n<h3>Virtual Memory</h3>\n<p>Virtual memory maps virtual addresses to physical memory and, when supported, can use storage to hold some memory contents. It helps provide isolation and flexible allocation.</p>\n<h3>Paging</h3>\n<p>Paging divides virtual memory into pages. The OS and hardware manage mappings between virtual pages and physical frames.</p>\n<h3>Memory Pressure</h3>\n<p>When many processes demand memory, the system may slow down because it must reclaim memory, page data, or reduce available working space.</p>\n<h3>Chapter Recap</h3>\n<p>Remember: address space; memory isolation; virtual memory.</p>"
  },
  {
    "title": "Chapter 7: Performance, Overhead, and Scalability",
    "html": "<h1>Chapter 7: Performance, Overhead, and Scalability</h1><figure><img src=\"assets/firstyear7-figure-05.png\" alt=\"Original comparison figure for chapter 7\" loading=\"lazy\"><figcaption>Original comparison figure from the supplied PDF (page 15)</figcaption></figure><h3>Resource Use</h3>\n<p>Running processes consume CPU time, memory, and sometimes disk or network bandwidth. High resource use can affect other applications.</p>\n<h3>Overhead</h3>\n<p>Process creation, scheduling, communication, and context switching involve work beyond the application’s main task. Efficient design avoids unnecessary overhead.</p>\n<h3>Parallel Processing</h3>\n<p>Some work can be divided into tasks that execute simultaneously on multiple CPU cores. Not all tasks benefit equally because coordination also costs time.</p>\n<h3>Load Balancing</h3>\n<p>Load balancing distributes work among available workers or servers to reduce bottlenecks and improve response time.</p>\n<h3>Scalability</h3>\n<p>A scalable system can handle more users or data without a disproportionate loss of performance. Monitoring and testing help identify limits.</p>\n<h3>Chapter Recap</h3>\n<p>Remember: resource use; overhead; parallel processing.</p>"
  },
  {
    "title": "Chapter 8: Security and Process Isolation",
    "html": "<h1>Chapter 8: Security and Process Isolation</h1><figure><img src=\"assets/firstyear7-figure-06.png\" alt=\"Original comparison figure for chapter 8\" loading=\"lazy\"><figcaption>Original comparison figure from the supplied PDF (page 17)</figcaption></figure><h3>Software Vulnerabilities</h3>\n<p>Programs can contain security flaws, such as unsafe input handling or memory errors. These may affect the running processes.</p>\n<h3>Access Controls</h3>\n<p>Operating systems use accounts, permissions, and access rules to restrict what processes can read, modify, or execute.</p>\n<h3>Sandboxing</h3>\n<p>Sandboxing limits a program’s or process’s access to sensitive resources. It can reduce the damage caused by compromised software.</p>\n<h3>Updates and Testing</h3>\n<p>Security patches fix known problems. Testing updates before deployment can help reduce unexpected failures.</p>\n<h3>Safe Habits</h3>\n<p>Install software from trusted sources, update regularly, use appropriate permissions, and avoid giving applications more access than they need.</p>\n<h3>Chapter Recap</h3>\n<p>Remember: software vulnerabilities; access controls; sandboxing.</p>"
  },
  {
    "title": "Chapter 9: Maintenance, Updates, and Monitoring",
    "html": "<h1>Chapter 9: Maintenance, Updates, and Monitoring</h1><figure><img src=\"assets/firstyear7-figure-07.png\" alt=\"Original comparison figure for chapter 9\" loading=\"lazy\"><figcaption>Original comparison figure from the supplied PDF (page 19)</figcaption></figure><h3>Version Control</h3>\n<p>Developers use version control to record changes to source code, collaborate, and return to earlier versions. A running process is not itself a version-controlled source-code file.</p>\n<h3>Updating Programs</h3>\n<p>Updates may fix bugs, add features, or address security issues. An updated program may need to be restarted before its new code is used by a running instance.</p>\n<h3>Monitoring Processes</h3>\n<p>System tools show running processes and their resource use. Monitoring helps identify memory leaks, stalled applications, or excessive CPU use.</p>\n<h3>Troubleshooting</h3>\n<p>When a program becomes unresponsive, check its process, resource usage, logs, and recent changes before restarting it.</p>\n<h3>Stability</h3>\n<p>Good maintenance includes backups, testing, updates, and careful configuration changes.</p>\n<h3>Chapter Recap</h3>\n<p>Remember: version control; updating programs; monitoring processes.</p>"
  },
  {
    "title": "Chapter 10: Real-World Examples and Best Practices",
    "html": "<h1>Chapter 10: Real-World Examples and Best Practices</h1><figure><img src=\"assets/firstyear7-figure-08.png\" alt=\"Original comparison figure for chapter 10\" loading=\"lazy\"><figcaption>Original comparison figure from the supplied PDF (page 21)</figcaption></figure><figure><img src=\"assets/firstyear7-figure-09.png\" alt=\"Original comparison figure for chapter 10\" loading=\"lazy\"><figcaption>Original comparison figure from the supplied PDF (page 22)</figcaption></figure><h3>Web Browsing</h3>\n<p>A browser program may launch multiple processes for tabs, rendering, and other services. These processes may be isolated to improve stability and security.</p>\n<h3>Video Editing</h3>\n<p>A video-editing program can run processes that read footage, apply effects, and render output. Rendering may use substantial CPU, GPU, and memory resources.</p>\n<h3>Games and Applications</h3>\n<p>A game is installed as a program. When launched, it becomes one or more running processes that use memory, graphics, and input devices.</p>\n<h3>Best Practices</h3>\n<p>Use appropriate monitoring tools, close unnecessary applications, keep software updated, and design programs to handle errors and resource limits.</p>\n<h3>Final Comparison</h3>\n<p>Program: stored instructions that can be launched repeatedly. Process: a running instance with its own execution state and managed resources. Understanding both helps with programming, troubleshooting, and system administration. FIRST YEAR BOOK 7 • PROGRAMS AND PROCESSES                                                                     21</p>\n<h3>Chapter Recap</h3>\n<p>Remember: web browsing; video editing; games and applications.</p>"
  },

const toc = document.getElementById('toc');
const content = document.getElementById('content');
const prev = document.getElementById('prev') || document.getElementById('previous');
const next = document.getElementById('next');
const status = document.getElementById('status');
const heading = document.getElementById('heading');
let current = 0;
function render() {
  const page = LESSON_PAGES[current];
  content.innerHTML = page.html;
  if (heading) heading.textContent = page.title;
  toc.replaceChildren();
  LESSON_PAGES.forEach((item, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = item.title;
    if (i === current) b.classList.add('active');
    b.addEventListener('click', () => go(i));
    toc.appendChild(b);
  });
  prev.disabled = current === 0;
  next.disabled = current === LESSON_PAGES.length - 1;
  if (status) status.textContent = `Section ${current + 1} of ${LESSON_PAGES.length}`;
}
function go(i) {
  if (i < 0 || i >= LESSON_PAGES.length) return;
  current = i;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
prev.addEventListener('click', () => go(current-1));
next.addEventListener('click', () => go(current+1));
render();

/* BYTEBLOOM - LIGHT AND DARK MODE */

(function () {
    const toggle = document.getElementById("themeToggle");
    const reader = document.querySelector(".reader");

    if (!toggle || !reader) return;

    const key = "bytebloom-reader-theme";

    function setTheme(mode) {
        const dark = mode === "dark";

        reader.classList.toggle("dark-mode", dark);

        toggle.textContent = dark
            ? "☀️ Light Mode"
            : "🌙 Dark Mode";

        toggle.setAttribute("aria-pressed", String(dark));
    }

    let saved = "light";

    try {
        saved = localStorage.getItem(key) || "light";
    } catch (_) {}

    setTheme(saved);

    toggle.addEventListener("click", function () {
        const mode = reader.classList.contains("dark-mode")
            ? "light"
            : "dark";

        setTheme(mode);

        try {
            localStorage.setItem(key, mode);
        } catch (_) {}
    });
})();
