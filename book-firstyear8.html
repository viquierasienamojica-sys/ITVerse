  <script>
const LESSON_PAGES = [
  {
    "title": "Book Introduction",
    "html": "<h1>Computer Networks and Internet Communication</h1><p><strong>First Year · Book 08</strong></p><h2>Introduction</h2><p>Computer networks connect devices and enable online communication. This book develops the topics in the supplied 21-page source into seven organized chapters, with original explanations, diagrams, practical examples, quizzes, and review materials. Some details clarify or update simplified statements in the source.</p><figure><img src=\"assets/firstyear8-figure-01.png\" alt=\"Laptop through Wi-Fi router and ISP to web server\"><figcaption>Original instructional diagram from PDF page 1</figcaption></figure><h2>Learning Objectives</h2><ul><li>Describe networks, the Internet, and the Web.</li><li>Identify common connection types and networking devices.</li><li>Explain IP and MAC addressing and packet forwarding.</li><li>Distinguish IP, TCP, UDP, and application protocols.</li><li>Explain how browsers, URLs, and DNS work together.</li><li>Outline major milestones in Internet history.</li><li>Apply safe browsing and basic troubleshooting techniques.</li></ul>"
  },
  {
    "title": "Chapter 1: Networks and the Internet",
    "html": "<h1>Chapter 1: Networks and the Internet</h1><figure><img src=\"assets/firstyear8-figure-02.png\" alt=\"Network communication diagram for chapter 1\" loading=\"lazy\"><figcaption>Original instructional diagram from PDF page 3</figcaption></figure><h3>What Is a Computer Network?</h3>\n<p>A computer network connects two or more devices so they can exchange information and share resources. A home network might connect a laptop, smartphone, smart television, and printer through a router.</p>\n<h3>Internet Versus World Wide Web</h3>\n<p>The Internet is the global network infrastructure that carries data. The World Wide Web is one service built on the Internet: interconnected websites and pages accessed through browsers. Email, online games, and messaging also use the Internet.</p>\n<h3>Client and Server</h3>\n<p>A client requests a service, and a server responds. When you open a website, the browser is a client and a web server provides the requested content. Some systems combine client and server roles.</p>\n<h3>Internet Service Providers</h3>\n<p>An ISP connects customers to wider networks. ISPs operate and connect equipment such as routers, optical links, and wireless infrastructure. Data can cross multiple networks before reaching a destination.</p>\n<h3>Real-Life Example</h3>\n<p>When a student watches an educational video, a device sends a request through a local network and ISP to a remote service. Video data returns in packets and the application plays the content.</p>\n<h3>Chapter Summary</h3>\n<p>Remember: what is a computer network?, internet versus world wide web, client and server, internet service providers.</p>"
  },
  {
    "title": "Chapter 2: Network Connections and Devices",
    "html": "<h1>Chapter 2: Network Connections and Devices</h1><figure><img src=\"assets/firstyear8-figure-03.png\" alt=\"Network communication diagram for chapter 2\" loading=\"lazy\"><figcaption>Original instructional diagram from PDF page 5</figcaption></figure><h3>Ethernet</h3>\n<p>Ethernet is a common wired networking technology. Many copper Ethernet cables use an RJ-45-style connector. Wired connections often offer predictable performance and low interference.</p>\n<h3>Wi-Fi</h3>\n<p>Wi-Fi uses radio communication to connect devices to wireless access points. It is convenient for mobile devices, but distance, walls, and interference can affect performance.</p>\n<h3>Fiber-Optic Connections</h3>\n<p>Fiber-optic cables carry signals as light. They are useful for high-bandwidth and long-distance links and are widely used in ISP networks and data centers.</p>\n<h3>Routers, Switches, and Hubs</h3>\n<p>Routers forward packets between networks. Switches connect devices on a local network and forward Ethernet frames to the appropriate ports. Hubs repeat incoming signals to all ports and are rarely used today.</p>\n<h3>Network Troubleshooting</h3>\n<p>Start by checking the device, cable or Wi-Fi connection, local router, IP settings, and Internet service. Test one part at a time to find where communication stops.</p>\n<h3>Chapter Summary</h3>\n<p>Remember: ethernet, wi-fi, fiber-optic connections, routers, switches, and hubs.</p>"
  },
  {
    "title": "Chapter 3: IP Addresses, MAC Addresses, and Packets",
    "html": "<h1>Chapter 3: IP Addresses, MAC Addresses, and Packets</h1><figure><img src=\"assets/firstyear8-figure-04.png\" alt=\"Network communication diagram for chapter 3\" loading=\"lazy\"><figcaption>Original instructional diagram from PDF page 7</figcaption></figure><h3>Why Addresses Matter</h3>\n<p>Devices need addressing information to exchange data. An IP address identifies a network interface in an IP network and supports routing to a destination.</p>\n<h3>IP and MAC Addresses</h3>\n<p>IP addresses are logical addresses used for network communication. MAC addresses are link-layer identifiers commonly used on local networks. A MAC address is not always permanent or globally unique because it can be changed or randomized.</p>\n<h3>IPv4 and IPv6</h3>\n<p>IPv4 addresses contain 32 bits, commonly written as four decimal numbers such as 192.0.2.10. IPv6 uses 128-bit addresses, commonly written in hexadecimal, and supports a much larger address space.</p>\n<h3>Packets and Routing</h3>\n<p>Large communications are handled as smaller units. IP packets carry source and destination addresses, while routers examine destination addresses to choose a next hop. Different packets can take different paths.</p>\n<h3>Delivery and Reassembly</h3>\n<p>Depending on the protocol, a receiver can reorder data and detect missing information. TCP provides reliable ordered byte-stream delivery; IP by itself does not guarantee that packets arrive.</p>\n<h3>Chapter Summary</h3>\n<p>Remember: why addresses matter, ip and mac addresses, ipv4 and ipv6, packets and routing.</p>"
  },
  {
    "title": "Chapter 4: Network Protocols and TCP/IP",
    "html": "<h1>Chapter 4: Network Protocols and TCP/IP</h1><h3>What Is a Protocol?</h3>\n<p>A network protocol is a set of agreed rules for formatting and exchanging data. Protocols let different devices and operating systems communicate.</p>\n<h3>Internet Protocol</h3>\n<p>IP supplies addressing and packet forwarding. Routers use IP destination addresses to move packets toward their destination, but IP does not itself promise reliable delivery.</p>\n<h3>Transmission Control Protocol</h3>\n<p>TCP creates a connection and provides ordered, reliable data delivery using acknowledgments, sequence numbers, and retransmissions. It is commonly used for file transfers and many web connections.</p>\n<h3>UDP and Modern Web Transport</h3>\n<p>UDP sends datagrams without built-in reliability or ordering. Some real-time applications use UDP. HTTP/3 uses QUIC, a protocol built over UDP that adds secure, reliable transport capabilities.</p>\n<h3>A Practical Example</h3>\n<p>When a browser accesses a web service, application protocols and transport protocols work together. DNS may locate the server address, IP routes packets, and TCP or QUIC carries application data.</p>\n<h3>Chapter Summary</h3>\n<p>Remember: what is a protocol?, internet protocol, transmission control protocol, udp and modern web transport.</p>"
  },
  {
    "title": "Chapter 5: Websites, URLs, and DNS",
    "html": "<h1>Chapter 5: Websites, URLs, and DNS</h1><figure><img src=\"assets/firstyear8-figure-05.png\" alt=\"Network communication diagram for chapter 5\" loading=\"lazy\"><figcaption>Original instructional diagram from PDF page 11</figcaption></figure><h3>Web Pages and Browsers</h3>\n<p>Web pages commonly use HTML to structure content, CSS to style it, and JavaScript for interaction. A browser requests resources and displays the result.</p>\n<h3>Understanding URLs</h3>\n<p>A URL identifies a resource and may include a scheme, hostname, path, query, and fragment. Example: https://example.org/lessons/networking. The https scheme indicates secure HTTP communication.</p>\n<h3>Domains and Top-Level Domains</h3>\n<p>A domain is a human-readable name. Common top-level domains include .com, .org, and .edu, but a suffix alone does not guarantee what kind of organization owns a website.</p>\n<h3>Domain Name System</h3>\n<p>DNS translates names to records such as IP addresses. A resolver may answer from its cache or query other DNS servers. Websites can have multiple addresses, and addresses can change.</p>\n<h3>Visiting a Website Step by Step</h3>\n<p>First, enter a URL. The browser resolves the hostname, establishes a connection, sends an HTTP request, receives a response, and renders the page. HTTPS also uses encryption to protect the connection.</p>\n<h3>Troubleshooting DNS</h3>\n<p>If a domain name fails to resolve, check spelling, network connection, DNS configuration, and whether the site itself is reachable. A failed domain lookup is only one possible reason a page will not load.</p>\n<h3>Chapter Summary</h3>\n<p>Remember: web pages and browsers, understanding urls, domains and top-level domains, domain name system.</p>"
  },
  {
    "title": "Chapter 6: History and Evolution of the Internet",
    "html": "<h1>Chapter 6: History and Evolution of the Internet</h1><h3>Early Networking</h3>\n<p>Early computers were expensive and often used in centralized environments. Researchers sought ways to share computing resources across distances.</p>\n<h3>ARPANET</h3>\n<p>ARPANET began operating in 1969 as a pioneering packet-switched network supported by the U.S. Advanced Research Projects Agency (ARPA). It connected research institutions and influenced later networking.</p>\n<h3>TCP/IP Development</h3>\n<p>Vint Cerf and Bob Kahn helped develop internetworking protocols during the 1970s. ARPANET transitioned to TCP/IP in 1983, an important milestone for the Internet.</p>\n<h3>Birth of the World Wide Web</h3>\n<p>Tim Berners-Lee developed the World Wide Web at CERN around 1989-1991. Web pages, URLs, and HTTP made information easier to link and access. The Web is newer than the Internet.</p>\n<h3>Growth and Modern Services</h3>\n<p>Over time, the Internet expanded to support email, search, streaming, online learning, mobile apps, and cloud computing. Modern networks continue evolving with IPv6, faster access technologies, and connected devices.</p>\n<h3>Chapter Summary</h3>\n<p>Remember: early networking, arpanet, tcp/ip development, birth of the world wide web.</p>"
  },
  {
    "title": "Chapter 7: Practical Internet Communication and Safety",
    "html": "<h1>Chapter 7: Practical Internet Communication and Safety</h1><h3>Putting the Layers Together</h3>\n<p>When you visit a website, several systems cooperate: Wi-Fi or Ethernet links your device locally, routers forward IP packets, DNS resolves the hostname, and HTTP exchanges web content.</p>\n<h3>Bandwidth and Latency</h3>\n<p>Bandwidth describes data-carrying capacity; latency describes delay. A fast download can still feel slow when latency is high. Congestion, weak wireless signals, and remote servers affect experience.</p>\n<h3>Safe Online Communication</h3>\n<p>Use HTTPS, update software, choose strong unique passwords, and be careful with unexpected links and attachments. HTTPS protects data in transit but does not guarantee that a website itself is trustworthy.</p>\n<h3>Troubleshooting Scenario</h3>\n<p>If a student cannot open a school website, first check whether the device is connected to Wi-Fi. Then try another website, check the address, and test whether the issue affects one device or the whole network.</p>\n<h3>Mini Case Study</h3>\n<p>A student sends an assignment through a learning platform. The browser finds the platform using DNS, communicates over an encrypted connection, uploads data in packets, and waits for a server response confirming the submission.</p>\n<h3>Chapter Summary</h3>\n<p>Remember: putting the layers together, bandwidth and latency, safe online communication, troubleshooting scenario.</p>"
  },
  {
    "title": "Learning Activities",
    "html": "<h1>Learning Activities</h1><h3>Activity 1</h3><p>Draw a home network with a phone, laptop, router, ISP, and remote server. Explain each connection.</p><h3>Activity 2</h3><p>Compare Ethernet, Wi-Fi, and fiber-optic connections in a table. Include one benefit and limitation of each.</p><h3>Activity 3</h3><p>Write down an example IPv4 address and identify which device forwards IP packets between networks.</p><h3>Activity 4</h3><p>Explain in your own words why TCP can recover from missing data but IP alone cannot guarantee delivery.</p><h3>Activity 5</h3><p>Break down the URL https://example.org/lessons/networking into scheme, host, and path.</p><h3>Activity 6</h3><p>Create a five-event timeline from ARPANET to the modern Web.</p><h3>Activity 7</h3><p>Make a troubleshooting checklist for a student who cannot open an online classroom.</p>"
  },
  {
    "title": "Glossary",
    "html": "<h1>Glossary</h1><p><strong>Bandwidth:</strong> Amount of data a connection can carry per unit time.</p><p><strong>Browser:</strong> Software for accessing and displaying web resources.</p><p><strong>Client:</strong> Device or software that requests a network service.</p><p><strong>DNS:</strong> Domain Name System; resolves domain names to DNS records.</p><p><strong>Ethernet:</strong> Common wired networking technology.</p><p><strong>Fiber-optic cable:</strong> Cable that carries data using light signals.</p><p><strong>HTTP:</strong> Protocol used to exchange web resources.</p><p><strong>HTTPS:</strong> HTTP protected using transport encryption.</p><p><strong>Internet:</strong> Global network of interconnected networks.</p><p><strong>IP address:</strong> Logical network address used by Internet Protocol.</p><p><strong>ISP:</strong> Internet Service Provider.</p><p><strong>Latency:</strong> Delay in communication.</p><p><strong>MAC address:</strong> Link-layer identifier used on local networks.</p><p><strong>Packet:</strong> Unit of data carried across a network.</p><p><strong>Router:</strong> Device that forwards packets between networks.</p><p><strong>Server:</strong> System that provides requested network services.</p><p><strong>Switch:</strong> Device that forwards frames within a local network.</p><p><strong>TCP:</strong> Reliable, ordered transport protocol.</p><p><strong>UDP:</strong> Datagram transport protocol without built-in reliability.</p><p><strong>URL:</strong> Uniform Resource Locator, an address for a resource.</p><p><strong>Wi-Fi:</strong> Wireless local-area networking technology.</p><p><strong>WWW:</strong> World Wide Web, a service using the Internet.</p>"
  },

const toc = document.getElementById('toc');
const content = document.getElementById('content');
const prev = document.getElementById('prev') || document.getElementById('previous');
const next = document.getElementById('next');
const status = document.getElementById('status');
const heading = document.getElementById('heading');
let current = 0;
function render() {
  const page = LESSON_PAGES[current];
  content.innerHTML = page.html;
  if (heading) heading.textContent = page.title;
  toc.replaceChildren();
  LESSON_PAGES.forEach((item, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = item.title;
    if (i === current) b.classList.add('active');
    b.addEventListener('click', () => go(i));
    toc.appendChild(b);
  });
  prev.disabled = current === 0;
  next.disabled = current === LESSON_PAGES.length - 1;
  if (status) status.textContent = `Section ${current + 1} of ${LESSON_PAGES.length}`;
}
function go(i) {
  if (i < 0 || i >= LESSON_PAGES.length) return;
  current = i;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
prev.addEventListener('click', () => go(current-1));
next.addEventListener('click', () => go(current+1));
render();

/* BYTEBLOOM - LIGHT AND DARK MODE */

(function () {
    const toggle = document.getElementById("themeToggle");
    const reader = document.querySelector(".reader");

    if (!toggle || !reader) return;

    const key = "bytebloom-reader-theme";

    function setTheme(mode) {
        const dark = mode === "dark";

        reader.classList.toggle("dark-mode", dark);

        toggle.textContent = dark
            ? "☀️ Light Mode"
            : "🌙 Dark Mode";

        toggle.setAttribute("aria-pressed", String(dark));
    }

    let saved = "light";

    try {
        saved = localStorage.getItem(key) || "light";
    } catch (_) {}

    setTheme(saved);

    toggle.addEventListener("click", function () {
        const mode = reader.classList.contains("dark-mode")
            ? "light"
            : "dark";

        setTheme(mode);

        try {
            localStorage.setItem(key, mode);
        } catch (_) {}
    });
})();
