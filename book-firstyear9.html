  <script>
const LESSON_PAGES = [
  {
    "title": "Book Introduction",
    "html": "<h1>Computer Ethics and Cyber Security</h1><p><strong>First Year · Book 09</strong></p><h2>Introduction</h2><p>The original three-page source introduces ethical behavior, cybercrime, privacy, piracy, unauthorized accounts, and the need to protect information. This book preserves those topics and adds original beginner-friendly explanations and safe everyday examples.</p><h2>Learning Objectives</h2><ul><li>Explain computer ethics and cyber security.</li><li>Recognize common cybercrime threats.</li><li>Use accounts, passwords, and personal data responsibly.</li><li>Describe practical device and network safety measures.</li><li>Respect copyright, privacy, and consent.</li><li>Respond appropriately to suspicious online activity.</li></ul>"
  },
  {
    "title": "Chapter 1: Introduction to Computer Ethics and Cyber Security",
    "html": "<h1>Chapter 1: Introduction to Computer Ethics and Cyber Security</h1><h3>Why Ethics and Security Matter</h3>\n<p>Computers and the Internet help people learn, work, shop, and communicate. They also create risks when data is stolen, accounts are misused, or digital content is shared without permission. The source lesson explains that valuable information must be protected because computer systems are vulnerable.</p>\n<h3>Computer Ethics</h3>\n<p>Computer ethics concerns the moral principles that guide how people use computers, networks, software, and online services. Ethical decisions consider honesty, fairness, respect, responsibility, and possible harm to other people.</p>\n<h3>Cyber Security</h3>\n<p>Cyber security is the practice of protecting devices, networks, accounts, and information against unauthorized access, damage, or disruption. Ethical behavior and technical safeguards support one another, but they are not identical.</p>\n<h3>Real-Life Example</h3>\n<p>A student finds a classmate’s account still signed in on a shared computer. Ethical behavior means signing out or notifying the owner instead of reading messages. Security practice means using a screen lock and signing out after use.</p>\n<h3>Key Takeaways</h3>\n<p>Review the chapter concepts and identify at least one way to apply them in everyday computer use.</p>"
  },
  {
    "title": "Chapter 2: Responsible and Ethical Computer Use",
    "html": "<h1>Chapter 2: Responsible and Ethical Computer Use</h1><h3>Rules from the Source</h3>\n<p>The original lesson lists four standards: do not use pirated software; do not use unauthorized user accounts; do not steal other people’s passwords; and do not hack. These rules emphasize consent and respect for digital property.</p>\n<h3>Privacy and Consent</h3>\n<p>Respect privacy by asking permission before accessing, collecting, or sharing someone’s personal information. Information that can identify a person includes names, account details, photos, contact information, and private messages.</p>\n<h3>Copyright and Digital Content</h3>\n<p>Creators may own rights to their software, images, writing, and videos. Use licensed software and follow the permission or license terms of material you reuse. Giving credit is valuable, but credit alone does not always replace permission.</p>\n<h3>Digital Citizenship</h3>\n<p>Responsible digital citizens verify information before reposting, avoid harassment, protect account credentials, and communicate respectfully. A message sent online can affect real people offline.</p>\n<h3>Key Takeaways</h3>\n<p>Review the chapter concepts and identify at least one way to apply them in everyday computer use.</p>"
  },
  {
    "title": "Chapter 3: Cybercrime and Common Online Threats",
    "html": "<h1>Chapter 3: Cybercrime and Common Online Threats</h1><figure><img src=\"assets/firstyear9-figure-01.png\" alt=\"Original diagram showing cybercrime categories including phishing, hacking, viruses, piracy, pharming and identity theft\" loading=\"lazy\"><figcaption>Original cybercrime diagram from PDF page 7. Financial transactions are criminal only when fraudulent or unauthorized.</figcaption></figure><p>What Is Cybercrime? Cybercrime involves illegal acts using computers, networks, or digital information. The original diagram names hacking, phishing, viruses, piracy, online financial transactions, pharming, and identity theft as related categories. Not every financial transaction is a crime; fraud involving a transaction is the harmful activity.</p>\n<h3>Phishing and Pharming</h3>\n<p>Phishing attempts to trick people into revealing passwords, payment details, or other information through deceptive messages or websites. Pharming redirects users toward fraudulent sites, sometimes by manipulating name-resolution or device settings.</p>\n<h3>Malware and Viruses</h3>\n<p>Malware is harmful software. A computer virus is one type of malware that attaches to other files or programs and spreads when executed. Other threats include ransomware, spyware, and malicious downloads.</p>\n<h3>Identity Theft and Financial Fraud</h3>\n<p>Identity theft occurs when someone misuses another person’s personal information. Financial scams may involve fake shops, fraudulent payment requests, or impersonation. Verify payment details using a trusted channel before sending money.</p>\n<h3>Key Takeaways</h3>\n<p>Review the chapter concepts and identify at least one way to apply them in everyday computer use.</p>"
  },
  {
    "title": "Chapter 4: Protecting Accounts and Personal Information",
    "html": "<h1>Chapter 4: Protecting Accounts and Personal Information</h1><h3>Strong Passwords and Passphrases</h3>\n<p>Use long, unique passwords or passphrases for important accounts. A password manager can help generate and store them. Reusing the same password increases the damage if one website suffers a breach.</p>\n<h3>Multi-Factor Authentication</h3>\n<p>Multi-factor authentication (MFA) asks for an additional form of verification beyond a password. Authenticator apps and security keys can reduce the risk of account takeover.</p>\n<h3>Recognizing Suspicious Messages</h3>\n<p>Be cautious of urgent requests, unexpected attachments, unusual links, and messages asking for secret codes. Open a service using its known website or app rather than a link in a suspicious message.</p>\n<h3>Protecting Shared Devices</h3>\n<p>Lock the screen, avoid saving passwords in public computers, sign out after use, and keep private files in approved locations. Report a lost device or suspicious account activity promptly.</p>\n<h3>Key Takeaways</h3>\n<p>Review the chapter concepts and identify at least one way to apply them in everyday computer use.</p>"
  },
  {
    "title": "Chapter 5: Device, Network, and Data Security",
    "html": "<h1>Chapter 5: Device, Network, and Data Security</h1><h3>Software Updates</h3>\n<p>Updates fix errors and may close security weaknesses. Install trusted operating-system, browser, and application updates promptly, especially security patches.</p>\n<h3>Backups</h3>\n<p>A backup is an additional copy of important data. Keep backups in a separate safe location or trusted cloud service and check that files can be restored. Backups help after device failure, accidental deletion, or ransomware.</p>\n<h3>Safe Downloads and Wi-Fi</h3>\n<p>Download applications from trusted sources and check permissions. Public Wi-Fi may expose users to unsafe or deceptive networks; prefer encrypted HTTPS connections and avoid connecting to unknown hotspots.</p>\n<h3>Basic Security Tools</h3>\n<p>Firewalls, endpoint protection, device encryption, and access permissions reduce risk. No single tool guarantees complete safety, so good habits and layered defenses remain important.</p>\n<h3>Key Takeaways</h3>\n<p>Review the chapter concepts and identify at least one way to apply them in everyday computer use.</p>"
  },
  {
    "title": "Chapter 6: Privacy, Copyright, and Online Responsibilities",
    "html": "<h1>Chapter 6: Privacy, Copyright, and Online Responsibilities</h1><h3>Digital Footprint</h3>\n<p>A digital footprint includes information created through posts, comments, uploads, and online activity. Before posting, consider whether the content exposes private details or could harm another person.</p>\n<h3>Handling Personal Data</h3>\n<p>Collect only the information needed for a legitimate purpose. Store it securely, limit access, and remove it when it is no longer needed under applicable rules.</p>\n<h3>Piracy and Intellectual Property</h3>\n<p>Software piracy means using or distributing software in violation of its license or applicable law. Choose legitimate licenses, open-source options, or educational versions when available.</p>\n<h3>Ethical Decision-Making</h3>\n<p>Before taking an action, ask: Do I have permission? Could this hurt someone? Am I respecting privacy and ownership? Would I be comfortable explaining my action to a teacher, employer, or account owner?</p>\n<h3>Key Takeaways</h3>\n<p>Review the chapter concepts and identify at least one way to apply them in everyday computer use.</p>"
  },
  {
    "title": "Chapter 7: Cyber Safety Scenarios and Response",
    "html": "<h1>Chapter 7: Cyber Safety Scenarios and Response</h1><h3>Suspicious Login Alert</h3>\n<p>If an account reports a login you do not recognize, visit the service through its official app or site, change the password, review active sessions, enable MFA, and report the event.</p>\n<h3>Possible Malware Infection</h3>\n<p>If a device behaves strangely after an unsafe download, disconnect it from networks if needed, inform a responsible technician, run trusted security checks, and avoid entering sensitive information until it is assessed.</p>\n<h3>A Friend Requests Your Password</h3>\n<p>Do not share passwords or verification codes, even with friends. Offer to help using approved sharing features or ask an authorized administrator to provide access.</p>\n<h3>Reporting and Recovery</h3>\n<p>Save relevant evidence without spreading harmful content, contact the appropriate platform or school IT staff, secure affected accounts, and follow organizational incident procedures. Avoid retaliating or trying to hack back.</p>\n<h3>Key Takeaways</h3>\n<p>Review the chapter concepts and identify at least one way to apply them in everyday computer use.</p>"
  },
  {
    "title": "Learning Activities",
    "html": "<h1>Learning Activities</h1><h3>Activity 1</h3><p>Create a two-column chart comparing computer ethics and cyber security, with two examples for each.</p><h3>Activity 2</h3><p>Write five classroom rules for responsible computer use and explain why each matters.</p><h3>Activity 3</h3><p>Study the original cybercrime diagram. Choose three threats and write one warning sign and one prevention step for each.</p><h3>Activity 4</h3><p>Draft a short guide for classmates on unique passwords, MFA, and suspicious links.</p><h3>Activity 5</h3><p>Make a checklist for securing a laptop, including updates, backups, and trusted downloads.</p><h3>Activity 6</h3><p>Read a fictional scenario about sharing a copyrighted image; describe a permission-respecting alternative.</p><h3>Activity 7</h3><p>Role-play reporting a suspicious account login to a school IT staff member.</p>"
  },
  {
    "title": "Glossary",
    "html": "<h1>Glossary</h1><dl><dt><strong>Authentication</strong></dt><dd>A process for verifying identity.</dd><dt><strong>Backup</strong></dt><dd>A separate copy of information for recovery.</dd><dt><strong>Computer ethics</strong></dt><dd>Moral principles guiding computer use.</dd><dt><strong>Copyright</strong></dt><dd>Legal rights associated with original creative works.</dd><dt><strong>Cybercrime</strong></dt><dd>Illegal activity involving computers or networks.</dd><dt><strong>Cyber security</strong></dt><dd>Protection of devices, networks, accounts, and data.</dd><dt><strong>Digital footprint</strong></dt><dd>Information left by online activities.</dd><dt><strong>Firewall</strong></dt><dd>A tool that filters network traffic according to rules.</dd><dt><strong>Identity theft</strong></dt><dd>Misuse of another person’s identifying information.</dd><dt><strong>Malware</strong></dt><dd>Software intended to harm, disrupt, or compromise systems.</dd><dt><strong>MFA</strong></dt><dd>Multi-factor authentication; use of more than one verification factor.</dd><dt><strong>Pharming</strong></dt><dd>A technique that redirects users to fraudulent sites.</dd><dt><strong>Phishing</strong></dt><dd>Deceptive messages or sites used to steal information.</dd><dt><strong>Piracy</strong></dt><dd>Unauthorized use or distribution of copyrighted material.</dd><dt><strong>Privacy</strong></dt><dd>Control over access to and use of personal information.</dd><dt><strong>Ransomware</strong></dt><dd>Malware that disrupts access to data, often for payment.</dd><dt><strong>Virus</strong></dt><dd>Malware that can replicate by infecting other files or programs.</dd></dl>"
  },
  {
    "title": "References and Conclusion",
    "html": "<h1>References</h1><p>Primary supplied material: 1stbook9.pdf, “Computer Ethics and Cyber Security,” 3 pages. Original material cites BrainKart: https://www.brainkart.com/article/Computer-Ethics-and-Cyber-Security_36701/ The chapter explanations, practical examples, quizzes, learning activities, and glossary are newly written educational expansions. They are not quotations from the original source.</p><h2>Conclusion</h2><p>Computer ethics and cyber security are essential parts of responsible digital life. By respecting privacy and ownership, protecting accounts, recognizing scams, and reporting problems appropriately, students can make safer and more responsible choices online.</p>"
  }
];

const toc = document.getElementById('toc');
const content = document.getElementById('content');
const prev = document.getElementById('prev') || document.getElementById('previous');
const next = document.getElementById('next');
const status = document.getElementById('status');
const heading = document.getElementById('heading');
let current = 0;
function render() {
  const page = LESSON_PAGES[current];
  content.innerHTML = page.html;
  if (heading) heading.textContent = page.title;
  toc.replaceChildren();
  LESSON_PAGES.forEach((item, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = item.title;
    if (i === current) b.classList.add('active');
    b.addEventListener('click', () => go(i));
    toc.appendChild(b);
  });
  prev.disabled = current === 0;
  next.disabled = current === LESSON_PAGES.length - 1;
  if (status) status.textContent = `Section ${current + 1} of ${LESSON_PAGES.length}`;
}
function go(i) {
  if (i < 0 || i >= LESSON_PAGES.length) return;
  current = i;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
prev.addEventListener('click', () => go(current-1));
next.addEventListener('click', () => go(current+1));
render();

/* BYTEBLOOM - LIGHT AND DARK MODE */

(function () {
    const toggle = document.getElementById("themeToggle");
    const reader = document.querySelector(".reader");

    if (!toggle || !reader) return;

    const key = "bytebloom-reader-theme";

    function setTheme(mode) {
        const dark = mode === "dark";

        reader.classList.toggle("dark-mode", dark);

        toggle.textContent = dark
            ? "☀️ Light Mode"
            : "🌙 Dark Mode";

        toggle.setAttribute("aria-pressed", String(dark));
    }

    let saved = "light";

    try {
        saved = localStorage.getItem(key) || "light";
    } catch (_) {}

    setTheme(saved);

    toggle.addEventListener("click", function () {
        const mode = reader.classList.contains("dark-mode")
            ? "light"
            : "dark";

        setTheme(mode);

        try {
            localStorage.setItem(key, mode);
        } catch (_) {}
    });
})();

</script>
</body>
</html>
