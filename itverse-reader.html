<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITVerse Reader</title><style>body{margin:0;background:#fff5fa;color:#71254e;font:16px Arial}header{background:#f8d6e7;padding:18px;display:flex;gap:25px}a{color:#a71966}main{max-width:1100px;margin:20px auto;padding:0 16px}iframe{width:100%;height:80vh;border:1px solid #e9bbd2;background:white;border-radius:12px}</style></head><body><header><a href="library.html">← Library</a><strong id="title">ITVerse Reader</strong></header><main><p id="message">Loading book…</p><iframe id="reader" title="Book content" hidden sandbox="allow-scripts"></iframe></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="js/itverse-supabase.js"></script><script>
(async()=>{const db=window.ITVerseDB,msg=document.getElementById('message'),frame=document.getElementById('reader');try{const a=await window.ITVerseAccount();if(!a){location.replace('login.html');return;}const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('No book selected');const {data:b,error}=await db.from('managed_books').select('*').eq('id',id).single();if(error)throw error;document.getElementById('title').textContent=b.title;const {data:signed,error:se}=await db.storage.from('itverse-books').createSignedUrl(b.file_path,1800);if(se)throw se;if(b.format==='pdf'){frame.src=signed.signedUrl;}else{const res=await fetch(signed.signedUrl);if(!res.ok)throw Error('Cannot load HTML');frame.srcdoc=await res.text();}frame.hidden=false;msg.remove();}catch(e){msg.textContent='Unable to open book: '+e.message;}})();
</script></body></html>
