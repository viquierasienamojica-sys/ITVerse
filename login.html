<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Login | ITVerse</title>
    <link rel="stylesheet" href="css/student-auth.css">
</head>

<body data-page="login">
    <main class="auth-wrap">
        <section class="panel">
            <h1 class="brand">🌸 ITVerse</h1>
            <p class="subtitle">Student Login</p>
            <form id="loginForm"><label for="email">Email Address</label><input id="email" type="email"
                    autocomplete="username" required><label for="password">Password</label><input id="password"
                    type="password" autocomplete="current-password" required><button class="wide"
                    type="submit">Login</button>
                <p id="message" class="message" role="status"></p>
            </form>
            <p class="foot">No account yet? <a href="signup.html">Sign Up</a></p>
        </section>
    </main>
    <script src="js/student-auth.js"></script>
</body>

</html>
